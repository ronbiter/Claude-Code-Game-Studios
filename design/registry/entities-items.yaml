formulas:
  - name: can_carry
    status: active
    source: design/gdd/inventory-system.md
    referenced_by:
      - design/gdd/inventory-system.md
    variables:
      - SlotsUsed
      - ItemSlots
      - MaxSlots
      - WeightCurrent
      - ItemWeight
      - MaxWeight
    output_range: [false, true]
    expression: "(SlotsUsed + ItemSlots ≤ MaxSlots) AND (WeightCurrent + ItemWeight ≤ MaxWeight)"
    notes: "Boolean output. Both slot and weight limits must be satisfied to carry an item."
    added: 2026-04-30
    revised: ""

  - name: stack_merge
    status: active
    source: design/gdd/inventory-system.md
    referenced_by:
      - design/gdd/inventory-system.md
    variables:
      - QuantityToAdd
      - MaxStack
      - CurrentStackCount
    output_range: [0, QuantityToAdd]
    expression: "min(QuantityToAdd, MaxStack − CurrentStackCount)"
    notes: "Returns number of units merged into existing stack. Remaining units form new stack or stay in world."
    added: 2026-04-30
    revised: ""

  - name: weight_after_use
    status: active
    source: design/gdd/inventory-system.md
    referenced_by:
      - design/gdd/inventory-system.md
    variables:
      - WeightCurrent
      - ItemWeight
      - QuantityConsumed
    output_range: [0, MaxWeight]
    expression: "WeightCurrent − (ItemWeight × QuantityConsumed)"
    notes: "Returns new total weight after item consumption. Always ≤ previous weight."
    added: 2026-04-30
    revised: ""

