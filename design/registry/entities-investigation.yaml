# Entity Registry — Investigation Domain
#
# PURPOSE: Investigation formulas + investigation/stealth detection constants.
# Load when working on: investigation-system, stealth-system, player-controller.
#
# Part of the split registry. Entry point: design/registry/entities-index.yaml

version: 1
last_updated: "2026-05-21"

formulas:
  - name: thread_progress
    status: active
    source: design/gdd/investigation-system.md
    referenced_by:
      - design/gdd/investigation-system.md
    variables:
      - N_discovered
      - N_total
    output_range: [0.0, 1.0]
    expression: "N_discovered / N_total"
    notes: "Thread completion percentage. State thresholds: Unknown (0.0), Suspected (0.01-0.49), Confirmed (0.50-0.99), Revealed (1.0)."
    added: 2026-04-30
    revised: ""

  - name: clue_accessibility
    status: active
    source: design/gdd/investigation-system.md
    referenced_by:
      - design/gdd/investigation-system.md
    variables:
      - G_combat
      - G_stealth
      - G_time
      - G_progression
    output_range: [0, 1]
    expression: "G_combat × G_stealth × G_time × G_progression"
    notes: "Binary output: 0 = blocked, 1 = accessible. All gates are binary (0 or 1). Clue accessible only if all gates pass."
    added: 2026-04-30
    revised: ""

