# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items: []

# Example:
#
# items:
#   - name: goblin_arm
#     status: active
#     source: design/gdd/combat.md   # drop defined in combat GDD
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md    # inventory GDD lists its weight/stack rules
#       - design/gdd/economy.md      # economy GDD references its sell price
#     value_gold: 5
#     weight: 1
#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: effective_move_speed
    status: active
    source: design/gdd/movement-system.md
    referenced_by:
      - design/gdd/movement-system.md
    variables:
      - V_base(S)
      - M_input
      - M_surface
      - M_stamina
      - M_slope
    output_range: [0, 1170]
    expression: "V_base(S) × M_input × M_surface × M_stamina × M_slope"
    notes: "Output in cm/s. Multiplicative stacking prevents degenerate combinations. Slope modifier creates downhill speed assist up to 1.3x."
    added: 2026-04-29
    revised: ""

  - name: stamina_consumption
    status: active
    source: design/gdd/movement-system.md
    referenced_by:
      - design/gdd/movement-system.md
    variables:
      - R_drain
      - C_flat
      - Δt
      - S_cur
    output_range: [0, 25]
    expression: "R_drain × Δt (continuous) or C_flat (discrete)"
    notes: "Frame-rate independent. Sprint drains 15/s; Dodge costs 25 flat; Jump costs 10 flat."
    added: 2026-04-29
    revised: ""

  - name: stamina_regeneration
    status: active
    source: design/gdd/movement-system.md
    referenced_by:
      - design/gdd/movement-system.md
    variables:
      - R_regen
      - M_state
      - M_surface
      - M_exhaust
      - T_delay
    output_range: [0, 24]
    expression: "R_regen × M_state × M_surface × M_exhaust (after T_delay)"
    notes: "Effective rate 0–24/s. Worst case (crouch+biomass+exhaust): 4.8/s."
    added: 2026-04-29
    revised: ""

  - name: noise_emission_radius
    status: active
    source: design/gdd/movement-system.md
    referenced_by:
      - design/gdd/movement-system.md
    variables:
      - N_base(S)
      - M_surface_noise
      - N_exhaust
      - K_scale
    output_range: [0, 200]
    expression: "clamp((N_base(S) × M_surface_noise + N_exhaust) × K_scale, 0, 200)"
    notes: "Output in meters. K_scale=1.5. Exhaustion adds +15 flat noise before scaling."
    added: 2026-04-29
    revised: ""

  - name: dodge_displacement
    status: active
    source: design/gdd/movement-system.md
    referenced_by:
      - design/gdd/movement-system.md
    variables:
      - V_current
      - T_windup
      - V_dodge_burst
      - T_active
      - V_recovery
      - T_recovery
    output_range: [290, 380]
    expression: "(V_current × T_windup) + (V_dodge_burst × T_active) + (V_recovery × T_recovery)"
    notes: "Output in cm. GDD '~200 cm' refers to active burst only. Total includes momentum carry and recovery."
    added: 2026-04-29
    revised: ""

  - name: healing_effectiveness
    status: active
    source: design/gdd/health-system.md
    referenced_by:
      - design/gdd/health-system.md
    variables:
      - HealAmount
      - CurrentHP
      - MaxHP
    output_range: [0, 60]
    expression: "min(HealAmount, MaxHP − CurrentHP)"
    notes: "No overheal. Returns 0 when CurrentHP = 100 (item wasted)."
    added: 2026-04-29
    revised: ""

  - name: environmental_damage_tick
    status: active
    source: design/gdd/health-system.md
    referenced_by:
      - design/gdd/health-system.md
    variables:
      - BaseRate
      - M_zone
    output_range: [5, 15]
    expression: "BaseRate × M_zone"
    notes: "Output in HP/s. Zone multipliers: Z01=1.0, Z02=1.5, Z03=1.0, Z04=2.5, Z05=3.0."
    added: 2026-04-29
    revised: ""

  - name: infection_exposure_damage
    status: active
    source: design/gdd/health-system.md
    referenced_by:
      - design/gdd/health-system.md
    variables:
      - BaseExposureRate
      - T_inBiomass
      - T_grace
    output_range: [0, 999]
    expression: "BaseExposureRate × max(0, T_inBiomass − T_grace)"
    notes: "Output in HP/s. T_grace=0.5s prevents instant damage from brief contact."
    added: 2026-04-29
    revised: ""

  - name: injury_speed_penalty
    status: active
    source: design/gdd/health-system.md
    referenced_by:
      - design/gdd/health-system.md
      - design/gdd/movement-system.md
    variables:
      - V_base
      - P_speed
    output_range: [480, 600]
    expression: "V_base × (1.0 − P_speed)"
    notes: "Output in cm/s. P_speed: Operational=0, Wounded=0, Critical=0.1, NearDeath=0.2."
    added: 2026-04-29
    revised: ""

  - name: injury_stamina_regen_penalty
    status: active
    source: design/gdd/health-system.md
    referenced_by:
      - design/gdd/health-system.md
      - design/gdd/movement-system.md
    variables:
      - R_base
      - P_regen
    output_range: [12, 20]
    expression: "R_base × (1.0 − P_regen)"
    notes: "Output in stamina/s. P_regen: Operational=0, Wounded=0, Critical=0.2, NearDeath=0.4."
    added: 2026-04-29
    revised: ""

  - name: injury_sprint_drain_penalty
    status: active
    source: design/gdd/health-system.md
    referenced_by:
      - design/gdd/health-system.md
      - design/gdd/movement-system.md
    variables:
      - R_sprint_base
      - P_drain
    output_range: [15.0, 17.25]
    expression: "R_sprint_base × (1.0 + P_drain)"
    notes: "Output in stamina/s. P_drain: Operational=0, Wounded=0, Critical=0.1, NearDeath=0.15."
    added: 2026-04-29
    revised: ""

  - name: injury_dodge_recovery_penalty
    status: active
    source: design/gdd/health-system.md
    referenced_by:
      - design/gdd/health-system.md
      - design/gdd/movement-system.md
    variables:
      - T_recovery_base
      - P_recovery
    output_range: [0.30, 0.40]
    expression: "T_recovery_base + P_recovery"
    notes: "Output in seconds. P_recovery: Operational=0, Wounded=0, Critical=0, NearDeath=0.1."
    added: 2026-04-29
    revised: ""

  - name: cell_infection_pressure
    status: active
    source: design/gdd/infection-spread-system.md
    referenced_by:
      - design/gdd/infection-spread-system.md
    variables:
      - H_i
      - d_i
      - R_i
      - M_terrain
      - M_weather
      - M_cure
    output_range: [-20, 30]
    expression: "Σ [ H_i × (1 - (d_i / R_i)²) × M_terrain × M_weather × M_cure ]"
    notes: "Output in pressure/sec. Summed over all active sources within radius. Negative when cure active. Divided by K_spread_rate (6.0) before accumulation."
    added: 2026-04-30
    revised: ""

  - name: infection_tick
    status: active
    source: design/gdd/infection-spread-system.md
    referenced_by:
      - design/gdd/infection-spread-system.md
    variables:
      - I_old
      - P_cell
      - T_tick
    output_range: [0, 100]
    expression: "clamp(I_old + (P_cell / K_spread_rate) × T_tick, 0, 100)"
    notes: "Output is new infection level (0-100). T_tick=10s, K_spread_rate=6.0. Session-scale pacing."
    added: 2026-04-30
    revised: ""

  - name: cure_suppressant
    status: active
    source: design/gdd/infection-spread-system.md
    referenced_by:
      - design/gdd/infection-spread-system.md
    variables:
      - S_cure
      - d_c
      - R_c
      - T_remaining
      - T_max
    output_range: [0.0, 1.0]
    expression: "max(0, 1 - Σ [ S_cure × (1 - (d_c / R_c)²) × T_remaining / T_max ])"
    notes: "Output is M_cure multiplier. 1.0 = no cure effect, 0.0 = full suppression. Stacks linearly across overlapping cures, caps at 0.0."
    added: 2026-04-30
    revised: ""

  - name: hive_spawn_probability
    status: active
    source: design/gdd/infection-spread-system.md
    referenced_by:
      - design/gdd/infection-spread-system.md
    variables:
      - K_base
      - W_distance
      - W_time
      - R_random
    output_range: [0.0, 1.0]
    expression: "clamp(K_base × W_distance × W_time × R_random, 0, 1)"
    notes: "Evaluated every 30s for eligible cells (level=100, no hive, cooldown expired, zone cap not reached). K_base=0.15."
    added: 2026-04-30
    revised: ""

  - name: zone_infection_aggregate
    status: active
    source: design/gdd/infection-spread-system.md
    referenced_by:
      - design/gdd/infection-spread-system.md
      - design/gdd/alien-ai-system.md
    variables:
      - I_cell
      - A_cell
    output_range: [0, 100]
    expression: "Σ (I_cell × A_cell) / Σ A_cell"
    notes: "Weighted average of cell infection levels per zone. Resolves Alien AI OQ-8. Alien AI can use this for zone-level scaling or GetCellInfectionLevel() for per-cell precision."
    added: 2026-04-30
    revised: ""

  - name: thread_progress
    status: active
    source: design/gdd/investigation-system.md
    referenced_by:
      - design/gdd/investigation-system.md
    variables:
      - N_discovered
      - N_total
    output_range: [0.0, 1.0]
    expression: "N_discovered / N_total"
    notes: "Thread completion percentage. State thresholds: Unknown (0.0), Suspected (0.01-0.49), Confirmed (0.50-0.99), Revealed (1.0)."
    added: 2026-04-30
    revised: ""

  - name: clue_accessibility
    status: active
    source: design/gdd/investigation-system.md
    referenced_by:
      - design/gdd/investigation-system.md
    variables:
      - G_combat
      - G_stealth
      - G_time
      - G_progression
    output_range: [0, 1]
    expression: "G_combat × G_stealth × G_time × G_progression"
    notes: "Binary output: 0 = blocked, 1 = accessible. All gates are binary (0 or 1). Clue accessible only if all gates pass."
    added: 2026-04-30
    revised: ""

  - name: can_carry
    status: active
    source: design/gdd/inventory-system.md
    referenced_by:
      - design/gdd/inventory-system.md
    variables:
      - SlotsUsed
      - ItemSlots
      - MaxSlots
      - WeightCurrent
      - ItemWeight
      - MaxWeight
    output_range: [false, true]
    expression: "(SlotsUsed + ItemSlots ≤ MaxSlots) AND (WeightCurrent + ItemWeight ≤ MaxWeight)"
    notes: "Boolean output. Both slot and weight limits must be satisfied to carry an item."
    added: 2026-04-30
    revised: ""

  - name: stack_merge
    status: active
    source: design/gdd/inventory-system.md
    referenced_by:
      - design/gdd/inventory-system.md
    variables:
      - QuantityToAdd
      - MaxStack
      - CurrentStackCount
    output_range: [0, QuantityToAdd]
    expression: "min(QuantityToAdd, MaxStack − CurrentStackCount)"
    notes: "Returns number of units merged into existing stack. Remaining units form new stack or stay in world."
    added: 2026-04-30
    revised: ""

  - name: weight_after_use
    status: active
    source: design/gdd/inventory-system.md
    referenced_by:
      - design/gdd/inventory-system.md
    variables:
      - WeightCurrent
      - ItemWeight
      - QuantityConsumed
    output_range: [0, MaxWeight]
    expression: "WeightCurrent − (ItemWeight × QuantityConsumed)"
    notes: "Returns new total weight after item consumption. Always ≤ previous weight."
    added: 2026-04-30
    revised: ""

  - name: faction_reputation_delta
    status: active
    source: design/gdd/faction-reputation-system.md
    referenced_by:
      - design/gdd/faction-reputation-system.md
      - design/gdd/quest-system.md
    variables:
      - base_delta
      - current_rep
      - infection_level
      - desperation_level
      - K_infection
      - K_desperation
    output_range: [-100, +100]
    expression: "clamp(current_rep + round(base_delta × (1.0 + K_infection × infection_level + K_desperation × desperation_level)), -100, +100)"
    notes: "Context amplifiers K_infection=0.5, K_desperation=0.5 give max 1.5x amplification. Max amplified delta: ±75."
    added: 2026-05-05
    revised: ""

  - name: standing_tier_from_reputation
    status: active
    source: design/gdd/faction-reputation-system.md
    referenced_by:
      - design/gdd/faction-reputation-system.md
      - design/gdd/hud-system.md
    variables:
      - rep
    output_range: ["Hunted", "Hostile", "Wary", "Unknown", "Known", "Trusted", "Allied"]
    expression: "piecewise: rep≤-76→Hunted, -75≤rep≤-51→Hostile, -50≤rep≤-26→Wary, -25≤rep≤+25→Unknown, +26≤rep≤+50→Known, +51≤rep≤+75→Trusted, rep≥+76→Allied"
    notes: "7 tiers at 25-point intervals. Used by HUD, trade price calculation, and faction-NPC Trust floor."
    added: 2026-05-05
    revised: ""

  - name: ripple_effect
    status: active
    source: design/gdd/faction-reputation-system.md
    referenced_by:
      - design/gdd/faction-reputation-system.md
    variables:
      - source_delta
      - target_rep
      - relationship
    output_range: [-100, +100]
    expression: "abs_delta=|source_delta|; if abs_delta<10: ripple=0; elif abs_delta≥25: ripple=round(source_delta/2.0)×-1; else: ripple=±5(Rival)/±10(Hostile)/0(Neutral). Allied halves negative ripples."
    notes: "Positive deltas hurt rivals (negative ripple). Negative deltas benefit rivals (positive ripple). Ripple value itself: -38 to +38."
    added: 2026-05-05
    revised: ""

  - name: trade_price_modifier
    status: active
    source: design/gdd/faction-reputation-system.md
    referenced_by:
      - design/gdd/faction-reputation-system.md
      - design/gdd/inventory-system.md
    variables:
      - rep
    output_range: ["unavailable", 1.00, 0.85, 0.70]
    expression: "tier=standing_tier_from_reputation(rep); tier∈{Hunted,Hostile,Wary}→N/A, Unknown/Known→1.00, Trusted→0.85, Allied→0.70"
    notes: "Trade unavailable below Wary. Trusted: 15% discount. Allied: 30% discount."
    added: 2026-05-05
    revised: ""

