# Domain: subsystems | Load this file only when working on subsystems architecture decisions.
#
# Covers: subsystem tiers, module structure, game instance subsystems, world subsystems,
# game state machine, movement, AI systems, infection spread.
#
# ADRs in this domain: ADR-0002, ADR-0004, ADR-0010, ADR-0012, ADR-0013

version: 2
last_updated: "2026-05-26"

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────

state_ownership:
  - state: game_state_machine_stack
    status: active
    owner_system: UHostileWorldGSM
    adr: docs/architecture/adr-0002-game-state-machine-implementation.md
    interface: "GetCurrentState() → FGameplayTag (read-only); IsStateActive(FGameplayTag) → bool; RequestStateTransition(FFSMEvent) — only valid write path"
    write_access: UHostileWorldGSM-only
    referenced_by:
      - docs/architecture/adr-0002-game-state-machine-implementation.md
    added: "2026-05-15"
    revised: ""

  - state: movement_state
    status: active
    owner_system: UHostileMovementComponent
    adr: docs/architecture/adr-0010-movement-architecture.md
    interface: "GetCurrentMovementState() → EHostileMovementState (read-only); OnMovementStateChanged delegate (subscribe via AddDynamic in BeginPlay)"
    write_access: UHostileMovementComponent-only (state resolved internally from CMC physics mode and input events; no external system may set movement state directly)
    referenced_by:
      - docs/architecture/adr-0010-movement-architecture.md
    added: "2026-05-20"
    revised: ""

  - state: character_stamina
    status: active
    owner_system: AHostileCharacter
    adr: docs/architecture/adr-0010-movement-architecture.md
    interface: "CanSprint() → bool; CanDodge(float Cost) → bool; CanJump() → bool (read-only queries for CMC); ConsumeStamina(float) and RegenStamina(float DeltaTime) — only valid write paths, called by CMC"
    write_access: AHostileCharacter-only via ConsumeStamina/RegenStamina (CMC calls these methods; no other system may write stamina directly)
    referenced_by:
      - docs/architecture/adr-0010-movement-architecture.md
    added: "2026-05-20"
    revised: ""

  - state: alien_squad_state
    status: active
    owner_system: UAlienSquadSubsystem
    adr: docs/architecture/adr-0012-alien-ai-system.md
    interface: "RegisterAlien(AAlienAIController*); UnregisterAlien(AAlienAIController*); GetSquadById(int32) → TArray<TWeakObjectPtr<AAlienAIController>>; GetAllActiveAliens() → TArray<TWeakObjectPtr<AAlienAIController>>; NotifyPlayerPosition(FVector); BroadcastSquadAlert(Source, Location, Score)"
    write_access: UAlienSquadSubsystem-only (AAlienAIController calls RegisterAlien/UnregisterAlien and BroadcastSquadAlert via subsystem; no direct TArray mutation from outside)
    referenced_by:
      - docs/architecture/adr-0012-alien-ai-system.md
    added: "2026-05-20"
    revised: ""

  - state: combat_state
    status: active
    owner_system: UCombatSubsystem
    adr: docs/architecture/adr-0014-combat-system-architecture.md
    interface: "GetCombatState() → ECombatState (read-only); IsPlayerUnderThreat() → bool (detection ≥75); NotifyCombatTrigger(ECombatTriggerSource) — only valid entry path; NotifyAlienEntersCombat/LOSLost/LOSRegained/BackupCalled for alien state updates"
    write_access: UCombatSubsystem-only (state machine transitions driven internally; UCombatComponent calls NotifyCombatTrigger() as the only external trigger path)
    referenced_by:
      - docs/architecture/adr-0014-combat-system-architecture.md
    added: "2026-05-21"
    revised: ""

  - state: infection_spread_state
    status: active
    owner_system: UInfectionSpreadSubsystem
    adr: docs/architecture/adr-0013-infection-spread-architecture.md
    interface: "IInfectionSpreadInterface — GetCellInfectionLevel(FIntPoint) → float; GetCellState(FIntPoint) → ECellInfectionState; GetNearbyCellInfectionLevels(FVector, float) → TArray; GetZoneInfectionLevel(FName) → float; GetActiveSourceCount(FName) → int32; GetSourcesInRadius(FVector, float) → TArray; DamageInfectionSource(FGuid, float) → bool; DeployCure(FVector) → bool. All callers use IInfectionSpreadInterface — no direct cast to UInfectionSpreadSubsystem."
    write_access: UInfectionSpreadSubsystem-only (FTimerHandle-driven ticks update CellData; DamageInfectionSource() and DeployCure() are the only external write paths)
    referenced_by:
      - docs/architecture/adr-0013-infection-spread-architecture.md
    added: "2026-05-20"
    revised: ""

  - state: player_health
    status: active
    owner_system: UHealthComponent
    adr: docs/architecture/adr-0015-health-system-architecture.md
    interface: "GetCurrentHP() → int32; GetMaxHP() → int32 (always 100); GetInjuryState() → EInjuryState; GetStaminaRegenMultiplier() → float; IsAlive() → bool; IsInvulnerable() → bool. Damage entry: ApplyDamage(float Amount, EDamageType) called via AHostileCharacter::TakeDamage() override. Healing entry: StartHealing(EConsumableType) / CancelHealing()."
    write_access: UHealthComponent-only (CurrentHP modified only inside ApplyDamage() and CompleteHealing(); no external HP write path)
    referenced_by:
      - docs/architecture/adr-0015-health-system-architecture.md
    added: "2026-05-24"
    revised: ""

  - state: stealth_detection_state
    status: active
    owner_system: UStealthSubsystem
    adr: docs/architecture/adr-0017-stealth-system-architecture.md
    interface: "IStealthDetection: ComputeAndGetAlienScore(AActor* TargetPlayer, AActor* ForAlien) → float — triggers D_total computation for ForAlien, updates GlobalDetectionLevel; GetDetectionScore(AActor* TargetActor) → float (GlobalDetectionLevel, read-only, no computation); GetCurrentDetectionState() → EStealthState; IsPlayerUnderThreat() → bool (GlobalDetectionLevel ≥ 75). All callers access via IStealthDetection — no direct cast to UStealthSubsystem."
    write_access: UStealthSubsystem-only (GlobalDetectionLevel and EStealthState updated only inside ComputeAndGetAlienScore(); no external detection score write path)
    referenced_by:
      - docs/architecture/adr-0017-stealth-system-architecture.md
    added: "2026-05-26"
    revised: ""

  - state: imc_stealth_lifecycle
    status: active
    owner_system: UStealthComponent
    adr: docs/architecture/adr-0017-stealth-system-architecture.md
    interface: "GetCurrentDetectionLevel() → float (thin pass-through to UStealthSubsystem); GetCurrentDetectionState() → EStealthState (thin pass-through). Internal: HandleDetectionStateChanged(EStealthState Old, EStealthState New) bound to UStealthSubsystem::OnDetectionStateChanged; HandleMovementStateChanged(EHostileMovementState) bound to UHostileMovementComponent::OnMovementStateChanged. IMC ops routed via AHostileWorldPlayerController::PushIMC()/PopIMC() — never EIUS directly."
    write_access: UStealthComponent-only (bIMCStealthActive, bCrouchTriggerActive, bDetectionTriggerActive, IMCPopCooldownHandle updated only inside the component's own event handlers; no external write path)
    referenced_by:
      - docs/architecture/adr-0017-stealth-system-architecture.md
      - docs/architecture/adr-0018-player-controller-architecture.md
    added: "2026-05-26"
    revised: ""

# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────

interfaces:
  - contract: movement_state_changed_event
    status: active
    pattern: dynamic_multicast_delegate
    description: "UHostileMovementComponent broadcasts OnMovementStateChanged(EHostileMovementState NewState) on every state transition. Consumers bind via AddDynamic() in BeginPlay(); RemoveDynamic() in EndPlay()."
    producer: UHostileMovementComponent (fired on every EHostileMovementState transition)
    consumers:
      - Stealth System (maps state to noise level and visibility modifier)
      - Camera System (adjusts arm length, FOV per state)
      - Alien AI System (player velocity and state for pursuit calculations)
      - HUD System (tactical HUD state display)
    adr: docs/architecture/adr-0010-movement-architecture.md
    referenced_by:
      - docs/architecture/adr-0010-movement-architecture.md
    added: "2026-05-20"
    revised: ""

  - contract: dodge_event
    status: active
    pattern: dynamic_multicast_delegate
    description: "UHostileMovementComponent fires OnDodgeStarted(float IFrameDuration) at dodge activation (0.10s wind-up complete) and OnDodgeEnded() at dodge complete (0.65s). IFrameDuration = 0.25s — Health System uses this to gate invulnerability window."
    producer: UHostileMovementComponent (PhysDodge() phase transitions)
    consumers:
      - Health System (i-frame invulnerability window: immune to damage for IFrameDuration after OnDodgeStarted)
      - Combat System (dodge window awareness for enemy attack timing)
      - Camera System (dodge motion blur trigger)
    adr: docs/architecture/adr-0010-movement-architecture.md
    referenced_by:
      - docs/architecture/adr-0010-movement-architecture.md
    added: "2026-05-20"
    revised: ""

  - contract: noise_emitted_event
    status: active
    pattern: dynamic_multicast_delegate
    description: "UHostileMovementComponent fires OnNoiseEmitted(float RadiusMeters) and calls UAISense_Hearing::ReportNoiseEvent() simultaneously. RadiusMeters = clamp((N_base × M_surface + N_exhaust) × 1.5, 0, 200). AI hearing percept handled natively by engine; OnNoiseEmitted is for non-AI consumers only."
    producer: UHostileMovementComponent (computed each tick when noise > 0)
    consumers:
      - Alien AI System (via UAIPerceptionSystem::MakeNoise — engine-native hearing percept)
      - Stealth System (noise radius for detection range calculation)
    adr: docs/architecture/adr-0010-movement-architecture.md
    referenced_by:
      - docs/architecture/adr-0010-movement-architecture.md
    added: "2026-05-20"
    revised: ""

  - contract: alien_death_event
    status: active
    pattern: dynamic_multicast_delegate
    description: "AAlienCharacter fires OnAlienKilled(AAlienCharacter* AlienActor) when HP reaches 0. Consumers bind via AddDynamic() in BeginPlay(); RemoveDynamic() in EndPlay(). UAlienSquadSubsystem also binds this to call UnregisterAlien()."
    producer: AAlienCharacter (fired when HP = 0)
    consumers:
      - Combat System (scoring, loot, kill tracking)
      - UAlienSquadSubsystem (UnregisterAlien call)
    adr: docs/architecture/adr-0012-alien-ai-system.md
    referenced_by:
      - docs/architecture/adr-0012-alien-ai-system.md
    added: "2026-05-20"
    revised: ""

  - contract: squad_alert_broadcast
    status: active
    pattern: direct_call
    description: "AAlienAIController calls UAlienSquadSubsystem::BroadcastSquadAlert(Source, TargetLocation, AlertScore) when detection threshold is crossed. Subsystem applies 1.5s delay, 3000cm distance filter, 1s debounce, and M_state multiplier before notifying receiving aliens via their BT Blackboard."
    producer: AAlienAIController (calls subsystem on detection threshold crossing)
    consumers:
      - UAlienSquadSubsystem (owns broadcast authority, filters, and delivery)
    adr: docs/architecture/adr-0012-alien-ai-system.md
    referenced_by:
      - docs/architecture/adr-0012-alien-ai-system.md
    added: "2026-05-20"
    revised: ""

  - contract: combat_engaged_event
    status: active
    pattern: dynamic_multicast_delegate
    description: "UCombatSubsystem fires OnCombatEngaged() when ECombatState transitions to CombatEntry. Fires OnCombatDisengaged() when ECombatState transitions to Disengaged. Consumers bind via AddDynamic() in BeginPlay(); RemoveDynamic() in EndPlay()."
    producer: UCombatSubsystem (fired on ECombatState transitions)
    consumers:
      - HUD System (combat state indicator, threat indicators)
      - Audio System (combat music fade-in/out)
      - Stealth System (OnCombatDisengaged → stealth reset to zero)
      - Investigation System (narrative-defer gate via IsPlayerUnderThreat())
    adr: docs/architecture/adr-0014-combat-system-architecture.md
    referenced_by:
      - docs/architecture/adr-0014-combat-system-architecture.md
    added: "2026-05-21"
    revised: ""

  - contract: backup_called_event
    status: active
    pattern: dynamic_multicast_delegate
    description: "UCombatSubsystem fires OnBackupCalled(int32 AlienID, FVector Location) when Alien AI reports a backup call via NotifyBackupCalled(). Consumers update threat indicators and audio."
    producer: UCombatSubsystem (via NotifyBackupCalled() from Alien AI)
    consumers:
      - HUD System (threat direction indicators update)
      - Audio System (cascading alien vocalization trigger)
    adr: docs/architecture/adr-0014-combat-system-architecture.md
    referenced_by:
      - docs/architecture/adr-0014-combat-system-architecture.md
    added: "2026-05-21"
    revised: ""

  - contract: cell_state_changed_event
    status: active
    pattern: dynamic_multicast_delegate
    description: "UInfectionSpreadSubsystem exposes FCellStateChangedDelegate OnCellStateChanged as a public UPROPERTY. Consumers call OnCellStateChanged.AddUObject(this, &...) in BeginPlay/Initialize(); RemoveDynamic/Remove() in EndPlay/Deinitialize(). Payload: FCellStateChangedPayload (CellCoords, OldState, NewState, InfectionLevel)."
    producer: UInfectionSpreadSubsystem (fired on every ECellInfectionState transition)
    consumers:
      - AHostileWorldPlayerController (camp threatened, route blocked events)
      - UHUDSubsystem (tactical HUD infection heatmap update)
    adr: docs/architecture/adr-0013-infection-spread-architecture.md
    referenced_by:
      - docs/architecture/adr-0013-infection-spread-architecture.md
    added: "2026-05-20"
    revised: ""

  - contract: hive_spawned_broadcast
    status: active
    pattern: gameplay_message_router
    description: "UInfectionSpreadSubsystem broadcasts FHiveSpawnedMessage on TAG_Event_Hive_Spawned when a procedural hive completes spawning. Zone-wide (15,000 cm audio attenuation). Consumers use UGameplayMessageSubsystem::RegisterListener<FHiveSpawnedMessage>(TAG_Event_Hive_Spawned, ...)."
    producer: UInfectionSpreadSubsystem (EvaluateHiveSpawns() on successful spawn)
    consumers:
      - Audio System (hive emergence SFX + controller rumble)
      - Quest System (hive-related objective tracking)
    adr: docs/architecture/adr-0013-infection-spread-architecture.md
    referenced_by:
      - docs/architecture/adr-0013-infection-spread-architecture.md
    added: "2026-05-20"
    revised: ""

  - contract: health_changed_event
    status: active
    pattern: dynamic_multicast_delegate
    description: "UHealthComponent fires OnHealthChanged(int32 PreviousHP, int32 NewHP, EDamageType DamageType) after every damage application and healed restoration. Step 5 of the 5-step damage pipeline. Consumers bind via AddDynamic() in BeginPlay(); RemoveDynamic() in EndPlay()."
    producer: UHealthComponent (fired in ApplyDamage() step 5 and CompleteHealing())
    consumers:
      - HUD System (health bar update, damage direction indicator, vignette opacity)
      - Audio System (breathing state machine, impact audio, death gasp trigger)
      - Animation System (injury state-driven locomotion blend trigger)
    adr: docs/architecture/adr-0015-health-system-architecture.md
    referenced_by:
      - docs/architecture/adr-0015-health-system-architecture.md
    added: "2026-05-24"
    revised: ""

  - contract: injury_state_changed_event
    status: active
    pattern: dynamic_multicast_delegate
    description: "UHealthComponent fires OnInjuryStateChanged(EInjuryState NewState) when HP crosses a threshold (51/26/11/1/0) or is restored above one. Transitions are immediate — no blend delay. Consumers use this to apply mechanical consequences."
    producer: UHealthComponent (fired in ApplyInjuryStateChange() synchronously with HP change)
    consumers:
      - UHostileMovementComponent (SetInjurySpeedMultiplier: 1.0/1.0/0.9/0.8 per state; SetDodgeRecoveryPenalty: +0.1s at NearDeath)
      - Animation System (injury locomotion blend, death montage trigger at Dead state)
      - Audio System (breathing escalation per injury state)
      - UStealthSubsystem (updates CachedInjuryNoisePenalty: 0/+5/+10/+15 per state; added to player noise in D_noise)
    adr: docs/architecture/adr-0015-health-system-architecture.md
    referenced_by:
      - docs/architecture/adr-0015-health-system-architecture.md
      - docs/architecture/adr-0017-stealth-system-architecture.md
    added: "2026-05-24"
    revised: "2026-05-26"

  - contract: detection_state_changed_event
    status: active
    pattern: dynamic_multicast_delegate
    description: "UStealthSubsystem fires OnDetectionStateChanged(EStealthState OldState, EStealthState NewState) on every EStealthState transition. Consumers bind via AddDynamic() in BeginPlay() / Initialize(); RemoveDynamic() in EndPlay() / Deinitialize()."
    producer: UStealthSubsystem (fired in ComputeAndGetAlienScore() after state machine evaluation)
    consumers:
      - UStealthComponent (IMC_Stealth push/pop management)
      - UHUDSubsystem (stealth state label and meter update)
      - UCombatSubsystem (OnStealthBroken gate — subscribes to state == Detected)
      - Audio System (tension music layer crossfade)
    adr: docs/architecture/adr-0017-stealth-system-architecture.md
    referenced_by:
      - docs/architecture/adr-0017-stealth-system-architecture.md
    added: "2026-05-26"
    revised: ""

  - contract: detection_level_changed_event
    status: active
    pattern: dynamic_multicast_delegate
    description: "UStealthSubsystem fires OnDetectionLevelChanged(float NewGlobalLevel) whenever GlobalDetectionLevel changes. Fired after every ComputeAndGetAlienScore() call that changes the max. UHUDSubsystem uses this to update the per-frame detection bar without subscribing to state transitions."
    producer: UStealthSubsystem (fired in ComputeAndGetAlienScore() when GlobalDetectionLevel changes)
    consumers:
      - UHUDSubsystem (detection bar color and value update — Tactical HUD mode)
    adr: docs/architecture/adr-0017-stealth-system-architecture.md
    referenced_by:
      - docs/architecture/adr-0017-stealth-system-architecture.md
    added: "2026-05-26"
    revised: ""

  - contract: stealth_broken_event
    status: active
    pattern: dynamic_multicast_delegate
    description: "UStealthSubsystem fires OnStealthBroken() exactly once when GlobalDetectionLevel first reaches 100. Does not re-fire on subsequent frames while GlobalDetectionLevel remains 100. Rearms when GlobalDetectionLevel drops below 100 (de-escalation). UCombatSubsystem uses this as the combat entry trigger from the stealth pathway."
    producer: UStealthSubsystem (fired in ComputeAndGetAlienScore() on first crossing of GlobalDetectionLevel = 100)
    consumers:
      - UCombatSubsystem (NotifyCombatTrigger(ECombatTriggerSource::StealthBroken))
      - Audio System (combat music fade-in trigger)
    adr: docs/architecture/adr-0017-stealth-system-architecture.md
    referenced_by:
      - docs/architecture/adr-0017-stealth-system-architecture.md
      - docs/architecture/adr-0014-combat-system-architecture.md
    added: "2026-05-26"
    revised: ""

  - contract: gsm_level_ready_event
    status: active
    pattern: dynamic_multicast_delegate
    description: "UHostileWorldGSM fires OnLevelReady(UWorld* World) after all UWorldSubsystem::Initialize() calls complete and AGameModeBase::StartPlay() returns. Re-broadcast of FWorldDelegates::OnWorldBeginPlay filtered to EWorldType::Game. Safe binding point for any Session-tier subscriber that needs to attach to World-tier subsystems. Added per ADR-0002 World Lifecycle Hooks supplement (2026-05-26)."
    producer: UHostileWorldGSM (HandleWorldBeginPlay → broadcast after EWorldType::Game filter)
    consumers:
      - UHUDSubsystem (BindWorldSystems() — attach to UCombatSubsystem, UStealthSubsystem, UInfectionSpreadSubsystem delegates for current world)
    adr: docs/architecture/adr-0002-game-state-machine-implementation.md
    referenced_by:
      - docs/architecture/adr-0002-game-state-machine-implementation.md
      - docs/architecture/adr-0016-hud-system-architecture.md
    added: "2026-05-26"
    revised: ""

  - contract: gsm_world_tear_down_event
    status: active
    pattern: dynamic_multicast_delegate
    description: "UHostileWorldGSM fires OnWorldTearDown(UWorld* World) before any UWorldSubsystem::Deinitialize() executes for the outgoing world. Re-broadcast of FWorldDelegates::OnPreWorldFinishDestroy filtered to EWorldType::Game. Last safe point to unbind delegates from World-tier producers before they are destroyed. Added per ADR-0002 World Lifecycle Hooks supplement (2026-05-26)."
    producer: UHostileWorldGSM (HandlePreWorldFinishDestroy → broadcast after EWorldType::Game filter)
    consumers:
      - UHUDSubsystem (UnbindWorldSystems() — detach from all World-tier subsystem delegates before destruction)
    adr: docs/architecture/adr-0002-game-state-machine-implementation.md
    referenced_by:
      - docs/architecture/adr-0002-game-state-machine-implementation.md
      - docs/architecture/adr-0016-hud-system-architecture.md
    added: "2026-05-26"
    revised: ""

  - contract: alien_perception_data_interface
    status: active
    pattern: uinterface_data_accessor
    description: "IAlienPerceptionData — UINTERFACE implemented by AAlienCharacter, providing alien-specific perception parameters to UStealthSubsystem. Backed by FAlienStatRow (UDataTable, ADR-0012). Three read-only accessors: GetHearingSensitivity() → float (P_hearing 0.5–2.0); GetVisionAcuity() → float (P_vision 0.5–2.0); GetEyeLocation() → FVector (LOS trace origin / eye socket). UStealthSubsystem casts AAlienCharacter* to IAlienPerceptionData inside ComputeAndGetAlienScore(); test doubles may implement the interface for isolated stealth unit tests. Minor ADR-0012 implementation supplement — no ADR-0012 revision required."
    producer: AAlienCharacter (implements IAlienPerceptionData; values resolved from FAlienStatRow at spawn)
    consumers:
      - UStealthSubsystem (ComputeAndGetAlienScore reads all three accessors per call)
    adr: docs/architecture/adr-0017-stealth-system-architecture.md
    referenced_by:
      - docs/architecture/adr-0017-stealth-system-architecture.md
      - docs/architecture/adr-0012-alien-ai-system.md
    added: "2026-05-26"
    revised: ""

