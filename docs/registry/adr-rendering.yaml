# ─── API DECISIONS ───────────────────────────────────────────────────────────

api_decisions:
  - purpose: physics_runtime
    status: active
    api: "Chaos Physics (UE 5.7 built-in) — UGeometryCollectionComponent for destruction, UPhysicalMaterial for surface materials"
    not: "Legacy PhysX APIs; any pre-UE5 physics primitive types"
    adr: docs/architecture/adr-0007-physics-collision-architecture.md
    reason: "PhysX was removed in UE5. Chaos is the only available runtime. Geometry Collection is the Chaos-native destructible pipeline."
    referenced_by:
      - docs/architecture/adr-0007-physics-collision-architecture.md
    added: "2026-05-20"
    revised: ""

  - purpose: custom_collision_channels
    status: active
    api: "EHostileCollision namespace aliases (HostileCollisionChannels.h) — ECC_GameTraceChannel1..8 mapped to Player/Alien/Infection/WorldObject/Vehicle/Projectile/Interactable/AIPerception"
    not: "Raw ECC_GameTraceChannelN magic numbers in code; ECC_Visibility for gameplay-specific traces"
    adr: docs/architecture/adr-0007-physics-collision-architecture.md
    reason: "Named aliases prevent channel number collisions, make collision intent readable, and allow channel remapping via a single header change."
    referenced_by:
      - docs/architecture/adr-0007-physics-collision-architecture.md
    added: "2026-05-20"
    revised: ""

  - purpose: world_streaming_authority
    status: active
    api: "World Partition (automatic, distance-based) — sole streaming authority for open world; separate UWorld for Mountain Prison via OpenLevel()"
    not: "ALevelStreamingVolume or manual LevelStreaming actors in the open world; mixing LevelStreaming and World Partition in the same world"
    adr: docs/architecture/adr-0008-scene-streaming-architecture.md
    reason: "World Partition is UE5's production streaming system. Mixing LevelStreaming and World Partition in the same world produces undefined streaming behavior per Epic documentation."
    referenced_by:
      - docs/architecture/adr-0008-scene-streaming-architecture.md
    added: "2026-05-20"
    revised: ""

  - purpose: data_layer_activation
    status: active
    api: "USceneManagementSubsystem::RequestDataLayerSwap(FName ZoneId, FName TargetLayer) — the only valid path for Data Layer activation/deactivation at runtime"
    not: "Direct UDataLayerManager::SetDataLayerInstanceRuntimeState() calls from any system other than USceneManagementSubsystem (note: UDataLayerSubsystem does not exist in UE 5.7 — UDataLayerManager is the correct class)"
    adr: docs/architecture/adr-0008-scene-streaming-architecture.md
    reason: "Centralizing Data Layer writes enforces the DL swap state machine (rollback, queue, 3s debounce). Direct calls bypass rollback and produce inconsistent world state."
    referenced_by:
      - docs/architecture/adr-0008-scene-streaming-architecture.md
    added: "2026-05-20"
    revised: ""

  - purpose: camera_mode_owner
    status: active
    api: "AHostileWorldPlayerCameraManager (APlayerCameraManager subclass) — owns all camera mode state, shake dispatch, recoil, and Cinematic delegation"
    not: "ULocalPlayerSubsystem for camera mode state; UActorComponent on PlayerController for camera logic; UCameraMode stack (Lyra pattern — not a built-in engine API)"
    adr: docs/architecture/adr-0009-camera-architecture.md
    reason: "APlayerCameraManager is the engine's designated camera owner. UpdateViewTarget() runs in the camera manager; all engine shake and FOV APIs live on it. Any other owner requires polling the camera manager — forbidden pattern (ADR-0001)."
    referenced_by:
      - docs/architecture/adr-0009-camera-architecture.md
    added: "2026-05-20"
    revised: ""

  - purpose: animation_blueprint_pattern
    status: active
    api: "UHostileWorldAnimInstance : UAnimInstance + Linked Anim Layers (UHostileCombatLayer, UHostileCoverLayer, UHostileLocomotionLayer) switched via LinkAnimClassLayers()/UnlinkAnimClassLayers()"
    not: "Single monolithic ABP state machine with all body regions inline; dual USkeletalMeshComponent (master-pose) for body splits; Control Rig VM for full-body procedural animation"
    adr: docs/architecture/adr-0011-animation-architecture.md
    reason: "Linked Anim Layers eliminate combinatorial state explosion (8 movement states × 4 weapon types × cover on/off). They are the UE5-native split-body solution within a single skeletal mesh component."
    referenced_by:
      - docs/architecture/adr-0011-animation-architecture.md
    added: "2026-05-20"
    revised: ""

  - purpose: foot_ik_implementation
    status: active
    api: "IK Rig runtime node in ABP post-process graph (IKRig_HostileCharacter) — two foot goals (IK_Foot_L, IK_Foot_R) with alpha-based enable/disable"
    not: "Control Rig VM node for foot IK (heavier than IK Rig; unjustified overhead for two-bone foot IK); legacy Two Bone IK node without pelvis correction; foot IK disabled entirely"
    adr: docs/architecture/adr-0011-animation-architecture.md
    reason: "IK Rig runtime node is purpose-built for limb IK and lighter than Control Rig VM. movement-system.md mandates foot IK on all locomotion surfaces. Alpha-based blending on the IK node disables cleanly during Dodge/Jump/Fall without graph branching."
    referenced_by:
      - docs/architecture/adr-0011-animation-architecture.md
    added: "2026-05-20"
    revised: ""

  - purpose: hud_widget_technology
    status: active
    api: "UMG (UUserWidget subclasses: UHUDWidget_Immersive, UHUDWidget_Tactical) managed by UHUDSubsystem (ULocalPlayerSubsystem). Minimap uses UUserWidget::OnPaint() override with FPaintContext draw calls — not UCanvasPanel."
    not: "AHUD::DrawHUD() canvas-draw HUD (legacy pattern, world-scoped actor lifecycle); UCanvasPanel for minimap rendering (layout widget, not a drawing surface); single monolithic widget tree with conditional visibility for both modes"
    adr: docs/architecture/adr-0016-hud-system-architecture.md
    reason: "ULocalPlayerSubsystem survives level transitions (ADR-0004). Dual widget classes enforce the GDD's two-independent-pipeline design. UCanvasPanel is a layout container — OnPaint() override is the correct custom-draw path in UMG."
    referenced_by:
      - docs/architecture/adr-0016-hud-system-architecture.md
    added: "2026-05-25"
    revised: ""

# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────

forbidden_patterns:
  - pattern: legacy_physx_apis
    status: active
    description: "No legacy PhysX primitive types, NxActor, or pre-UE5 physics APIs may be used. All physics is Chaos-native."
    why: "PhysX was removed in UE5. Any legacy physics API will fail to compile in UE 5.7."
    adr: docs/architecture/adr-0007-physics-collision-architecture.md
    added: "2026-05-20"

  - pattern: async_physics_with_sync_queries
    status: active
    description: "bTickPhysicsAsync must remain disabled (default). Do not enable async physics without revising ADR-0007."
    why: "Enabling async physics decouples physics state from the game thread. UPhysicsHelperSubsystem::GetSurfaceType() would read stale frame-N-1 data, producing incorrect surface classification and fall damage calculation."
    adr: docs/architecture/adr-0007-physics-collision-architecture.md
    added: "2026-05-20"

  - pattern: raw_collision_channel_numbers
    status: active
    description: "Raw ECC_GameTraceChannelN enum values must not be used in gameplay code. Use EHostileCollision:: namespace aliases from HostileCollisionChannels.h."
    why: "Magic channel numbers are unreadable and break silently if DefaultEngine.ini channel order changes. Named aliases make intent explicit and centralise remapping."
    adr: docs/architecture/adr-0007-physics-collision-architecture.md
    added: "2026-05-20"

  - pattern: manual_level_streaming_in_open_world
    status: active
    description: "No ALevelStreamingVolume, manual LevelStreaming actor, or ULevelStreamingDynamic calls may exist in the open world map. World Partition is the sole streaming authority."
    why: "World Partition and manual LevelStreaming are competing authorities. Mixing them in the same world produces undefined streaming behavior: double-streaming, incorrect cell unloads, missing collision."
    adr: docs/architecture/adr-0008-scene-streaming-architecture.md
    added: "2026-05-20"

  - pattern: direct_data_layer_write
    status: active
    description: "No subsystem may call UDataLayerManager::SetDataLayerInstanceRuntimeState() directly (note: UDataLayerSubsystem does not exist in UE 5.7; correct class is UDataLayerManager via GetWorld()->GetDataLayerManager()). All Data Layer activation must go through USceneManagementSubsystem::RequestDataLayerSwap()."
    why: "Direct Data Layer writes bypass the DL_Idle→Active state machine, skip rollback logic, ignore the swap queue, and bypass the 3.0s debounce. This leaves the world in an inconsistent partial state."
    adr: docs/architecture/adr-0008-scene-streaming-architecture.md
    added: "2026-05-20"

  - pattern: anim_bp_movement_state_polling
    status: active
    description: "UHostileWorldAnimInstance::NativeUpdateAnimation() must not call UHostileMovementComponent::GetCurrentMovementState() to detect state transitions. CachedMovementState is updated exclusively by the OnMovementStateChanged delegate callback."
    why: "Calling GetCurrentMovementState() each tick to detect state changes violates polling_state_in_tick (ADR-0001). Montage triggers and layer switches are event-driven, not tick-polled. Reading velocity/speed/direction for blending is permitted — that is continuous interpolation, not change detection."
    adr: docs/architecture/adr-0011-animation-architecture.md
    added: "2026-05-20"

  - pattern: direct_montage_play
    status: active
    description: "External systems (Combat System, Movement System) must not call GetMesh()->GetAnimInstance()->Montage_Play() directly. All external montage requests must go through AHostileCharacter proxy methods: PlayFireMontage(), PlayReloadMontage(), PlayMeleeMontage(). Internal ABP callbacks (dodge, cover) call Montage_Play() inside UHostileWorldAnimInstance."
    why: "Direct Montage_Play() calls bypass the UHostileWorldAnimInstance abstraction, create direct coupling between callers and ABP internals, and prevent the animation system from managing slot priority, blend weight, and montage state coherently."
    adr: docs/architecture/adr-0011-animation-architecture.md
    added: "2026-05-20"

  - pattern: direct_widget_to_subsystem_polling
    status: active
    description: "HUD widgets (UHUDWidget_Immersive, UHUDWidget_Tactical) must not call into any upstream subsystem (UHealthComponent, UCombatComponent, UStealthComponent, etc.) from NativeTick() or any per-frame path to detect state changes. All HUD state updates arrive via UHUDSubsystem forwarded multicast delegates bound in BindDelegates(). Widgets may call GetDataCache() once in BindDelegates() for initial state population only."
    why: "Per-frame polling of subsystem state violates polling_state_in_tick (ADR-0001). HUD widgets have 10 upstream sources — polling each from tick would generate O(n) per-frame subsystem reads and silently break when a source subsystem is unavailable during level transition."
    adr: docs/architecture/adr-0016-hud-system-architecture.md
    added: "2026-05-25"

  - pattern: direct_widget_to_camera_manager_binding
    status: active
    description: "HUD widgets must not bind delegates directly to AHostileWorldPlayerCameraManager::OnCameraModeChanged. All camera mode change notifications arrive via UHUDSubsystem::OnHUDCameraModeChanged (forwarded from UHUDSubsystem's world-scoped subscription). No widget may hold a reference to AHostileWorldPlayerCameraManager."
    why: "AHostileWorldPlayerCameraManager is a world-scoped actor destroyed on level transition. Direct widget-to-camera-manager bindings become dangling delegates after transition. Routing through UHUDSubsystem (which manages BindWorldSystems/UnbindWorldSystems) is the only safe path."
    adr: docs/architecture/adr-0016-hud-system-architecture.md
    added: "2026-05-25"

  - pattern: hud_widget_native_construct_delegate_bind
    status: active
    description: "HUD widgets must not bind or unbind UHUDSubsystem forwarded delegates in NativeConstruct() or NativeDestruct(). Delegate binding is managed exclusively by UHUDSubsystem calling Widget->BindDelegates(this) in ActivateWidget() and Widget->UnbindDelegates(this) in DeactivateWidget(). NativeConstruct() is used only to null-guard the CachedHUDSubsystem reference."
    why: "NativeDestruct() is not guaranteed to fire when RemoveFromParent() is called if the widget is still referenced. Relying on NativeDestruct() for delegate cleanup creates stale UObject* entries in the subsystem's delegate list, which produce crashes when the subsystem next broadcasts."
    adr: docs/architecture/adr-0016-hud-system-architecture.md
    added: "2026-05-25"
