# Domain: rendering | Load this file only when working on rendering architecture decisions.
#
# Covers: physics, collision, scene streaming, camera, animation, World Partition,
# Data Layers, Chaos Physics, IK, Linked Anim Layers, HUD/UI.
#
# ADRs in this domain: ADR-0007, ADR-0008, ADR-0009, ADR-0011, ADR-0016
# Note: Physics (ADR-0007) and Scene Streaming (ADR-0008) are classified here as
# the closest fit. Create adr-physics.yaml and adr-streaming.yaml if these grow.

version: 1
last_updated: "2026-05-20"

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────

state_ownership:
  - state: physics_surface_state
    status: active
    owner_system: UPhysicsHelperSubsystem
    adr: docs/architecture/adr-0007-physics-collision-architecture.md
    interface: "GetSurfaceType(FVector Location) → EHostileSurfaceType (read-only query); CalculateFallDamage(float) → float (pure formula); OnPlayerLanded / OnImpact delegates (subscribe via AddDynamic in BeginPlay)"
    write_access: UPhysicsHelperSubsystem-only (AHostileCharacter calls NotifyPlayerLanded/NotifyImpact; no other actor may fire these delegates)
    referenced_by:
      - docs/architecture/adr-0007-physics-collision-architecture.md
    added: "2026-05-20"
    revised: ""

  - state: scene_streaming_state
    status: active
    owner_system: USceneManagementSubsystem
    adr: docs/architecture/adr-0008-scene-streaming-architecture.md
    interface: "GetCurrentZone() → FName (read-only); GetZoneState(FName) → FZoneState (read-only); RequestDataLayerSwap(FName ZoneId, FName TargetLayer) — only valid Data Layer write path; GetStreamingState() → FStreamingState (read-only)"
    write_access: USceneManagementSubsystem-only (UInfectionSpreadSubsystem and others call RequestDataLayerSwap via ISceneManagementSubsystem interface; no system may call UDataLayerManager directly)
    referenced_by:
      - docs/architecture/adr-0008-scene-streaming-architecture.md
    added: "2026-05-20"
    revised: ""

  - state: camera_mode_state
    status: active
    owner_system: AHostileWorldPlayerCameraManager
    adr: docs/architecture/adr-0009-camera-architecture.md
    interface: "GetCameraMode() → EHostileCameraMode (read-only); SetCameraMode(Mode, BlendTime) — only valid mode-write path (called by AHostileWorldPlayerController only); AddShake(Class, Scale); AddRecoil(Pitch, Yaw)"
    write_access: AHostileWorldPlayerController-only (calls SetCameraMode via ICameraSystem interface; no other actor may set camera mode directly)
    referenced_by:
      - docs/architecture/adr-0009-camera-architecture.md
    added: "2026-05-20"
    revised: ""

  - state: hud_mode_state
    status: active
    owner_system: UHUDSubsystem
    adr: docs/architecture/adr-0016-hud-system-architecture.md
    interface: "GetHUDMode() → EHUDMode (read-only); RequestModeChange(EHUDMode) — only valid mode-write path (queued if bIsInCombat; applied on combat end); GetDataCache() → const FHUDDataCache& (read-only, for initial widget population in BindDelegates() only)"
    write_access: UHUDSubsystem-only (RequestModeChange queues change; no system may set EHUDMode directly)
    referenced_by:
      - docs/architecture/adr-0016-hud-system-architecture.md
    added: "2026-05-25"
    revised: ""

# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────

interfaces:
  - contract: physics_landed_event
    status: active
    pattern: dynamic_multicast_delegate
    description: "AHostileCharacter::Landed() override calls UPhysicsHelperSubsystem::NotifyPlayerLanded(). Consumers subscribe to UPhysicsHelperSubsystem::OnPlayerLanded via AddDynamic() in BeginPlay(); RemoveDynamic() in EndPlay()."
    producer: AHostileCharacter (via Landed() override)
    consumers:
      - UHealthComponent (fall damage calculation)
      - UCameraShakeManager (landing shake)
    adr: docs/architecture/adr-0007-physics-collision-architecture.md
    referenced_by:
      - docs/architecture/adr-0007-physics-collision-architecture.md
    added: "2026-05-20"
    revised: ""

  - contract: physics_impact_event
    status: active
    pattern: dynamic_multicast_delegate
    description: "AHostileCharacter::OnComponentHit binding calls UPhysicsHelperSubsystem::NotifyImpact(). Consumers subscribe to UPhysicsHelperSubsystem::OnImpact via AddDynamic() in BeginPlay(); RemoveDynamic() in EndPlay()."
    producer: AHostileCharacter (via OnComponentHit)
    consumers:
      - UCameraShakeManager (impact shake)
    adr: docs/architecture/adr-0007-physics-collision-architecture.md
    referenced_by:
      - docs/architecture/adr-0007-physics-collision-architecture.md
    added: "2026-05-20"
    revised: ""

  - contract: zone_crossed_event
    status: active
    pattern: dynamic_multicast_delegate
    description: "USceneManagementSubsystem broadcasts OnZoneCrossed(FName FromZone, FName ToZone) when player crosses a zone boundary (3.0s debounce). Consumers AddDynamic() in BeginPlay(); RemoveDynamic() in EndPlay()."
    producer: USceneManagementSubsystem (via AZoneBoundaryVolume overlap + 3.0s FTimerHandle debounce)
    consumers:
      - Camera System (environmental camera effects on zone change)
      - HUD System (zone name display update)
      - Alien AI System (zone state update for behavior selection)
    adr: docs/architecture/adr-0008-scene-streaming-architecture.md
    referenced_by:
      - docs/architecture/adr-0008-scene-streaming-architecture.md
    added: "2026-05-20"
    revised: ""

  - contract: camera_mode_changed_event
    status: active
    pattern: dynamic_multicast_delegate
    description: "AHostileWorldPlayerCameraManager broadcasts OnCameraModeChanged(EHostileCameraMode OldMode, EHostileCameraMode NewMode) on every mode transition. Consumers bind via OnCameraModeChanged.AddDynamic() in BeginPlay(); RemoveDynamic() in EndPlay()."
    producer: AHostileWorldPlayerCameraManager (fired in SetCameraMode() after mode enum update)
    consumers:
      - UHUDSubsystem (world-scoped subscription; forwards as OnHUDCameraModeChanged to active widget — widgets must NOT bind camera manager directly per forbidden_pattern: direct_widget_to_camera_manager_binding)
      - Stealth System (FOV reads camera mode)
      - Combat System (65° FOV on engage; recoil routing)
    adr: docs/architecture/adr-0009-camera-architecture.md
    referenced_by:
      - docs/architecture/adr-0009-camera-architecture.md
      - docs/architecture/adr-0016-hud-system-architecture.md
    added: "2026-05-20"
    revised: "2026-05-25"

  - contract: hud_widget_activate_deactivate
    status: active
    pattern: direct_call
    description: "UHUDSubsystem manages HUD widget lifecycle via explicit ActivateWidget(Widget) / DeactivateWidget(Widget) calls. ActivateWidget: calls Widget->AddToViewport(ZOrder=0), then Widget->BindDelegates(this), then widget reads FHUDDataCache for initial state. DeactivateWidget: calls Widget->UnbindDelegates(this), then Widget->RemoveFromParent(). NativeConstruct() sets CachedHUDSubsystem reference only — no delegate binding. NativeDestruct() is not relied on for cleanup."
    producer: UHUDSubsystem (calls Activate/Deactivate on mode switch and Initialize/Deinitialize)
    consumers:
      - UHUDWidget_Immersive
      - UHUDWidget_Tactical
    adr: docs/architecture/adr-0016-hud-system-architecture.md
    referenced_by:
      - docs/architecture/adr-0016-hud-system-architecture.md
    added: "2026-05-25"
    revised: ""

  - contract: hud_context_prompt_interface
    status: active
    pattern: direct_call
    description: "Systems that need to show context prompts (Player Controller, Tutorial System, Quest System) call UHUDSubsystem::RegisterContextPrompt(FContextPrompt) to register a prompt and receive an FContextPromptId handle. Call ClearContextPrompt(Id) to remove. UHUDSubsystem applies Formula 2 priority scoring and forwards the winning prompt(s) via OnHUDContextPrompt delegate. Max 2 simultaneous prompts (1 primary + 1 secondary per hud-system.md Rule 5)."
    producer: AHostileWorldPlayerController, UTutorialSubsystem (call RegisterContextPrompt / ClearContextPrompt)
    consumers:
      - UHUDWidget_Immersive (context prompts are the only persistent Immersive-mode element)
      - UHUDWidget_Tactical
    adr: docs/architecture/adr-0016-hud-system-architecture.md
    referenced_by:
      - docs/architecture/adr-0016-hud-system-architecture.md
    added: "2026-05-25"
    revised: ""

  - contract: movement_to_anim_state_push
    status: active
    pattern: dynamic_multicast_delegate
    description: "UHostileMovementComponent pushes EHostileMovementState to UHostileWorldAnimInstance via OnMovementStateChanged(EHostileMovementState NewState) delegate. ABP subscribes in NativeBeginPlay(); unsubscribes in NativeUninitializeAnimation(). CachedMovementState in ABP is written exclusively by this callback — never read from CMC inside NativeUpdateAnimation."
    producer: UHostileMovementComponent (fired on every EHostileMovementState transition)
    consumers:
      - UHostileWorldAnimInstance (updates CachedMovementState, triggers montages, switches Linked Layers)
    adr: docs/architecture/adr-0011-animation-architecture.md
    referenced_by:
      - docs/architecture/adr-0011-animation-architecture.md
    added: "2026-05-20"
    revised: ""

  - contract: combat_montage_request
    status: active
    pattern: direct_call
    description: "External systems (Combat System) request montage playback via AHostileCharacter proxy methods: PlayFireMontage(EHostileWeaponType), PlayReloadMontage(EHostileWeaponType), PlayMeleeMontage(). These proxy into UHostileWorldAnimInstance. No system may call GetMesh()->GetAnimInstance()->Montage_Play() directly."
    producer: Combat System / UCombatComponent (calls AHostileCharacter proxy methods)
    consumers:
      - UHostileWorldAnimInstance (calls Montage_Play on UpperBodySlot)
    adr: docs/architecture/adr-0011-animation-architecture.md
    referenced_by:
      - docs/architecture/adr-0011-animation-architecture.md
    added: "2026-05-20"
    revised: ""

