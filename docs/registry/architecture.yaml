# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: inter_system_events
    status: active
    pattern: dynamic_multicast_delegate
    description: "Owner→subscriber events. Producer declares DECLARE_DYNAMIC_MULTICAST_DELEGATE; consumers AddDynamic() in BeginPlay(), RemoveDynamic() in EndPlay()."
    adr: docs/architecture/adr-0001-cross-system-communication.md
    referenced_by:
      - docs/architecture/adr-0001-cross-system-communication.md
    added: "2026-05-15"
    revised: ""

  - contract: global_broadcast_events
    status: active
    pattern: gameplay_message_router
    description: "Global 1-to-many events where consumers are unknown at authoring time. Broadcast via UGameplayMessageSubsystem::BroadcastMessage<T>(); listen via RegisterListener<T>(). Handle must be member field, not local variable."
    producer: any system
    consumers: []
    adr: docs/architecture/adr-0001-cross-system-communication.md
    module_required: "GameplayMessageRuntime (Build.cs) + GameplayMessageRouter plugin (.uproject)"
    referenced_by:
      - docs/architecture/adr-0001-cross-system-communication.md
    added: "2026-05-15"
    revised: ""

  - contract: input_action_routing
    status: active
    pattern: dynamic_multicast_delegate
    description: "PC Route_* callbacks (SetupInputComponent bindings) fire ADR-0001 Tier 1 multicast delegates. Subsystems subscribe via AddDynamic(). PC never calls subsystem methods directly."
    producer: AHostileWorldPlayerController (Route_* callbacks)
    consumers:
      - Movement System (Route_Move, Route_Sprint, Route_Crouch, Route_Jump, Route_Dodge, Route_Lean*)
      - Combat System (Route_Attack, Route_Aim, Route_Reload, Route_Melee)
      - Inventory System (Route_Inventory, Route_QuickSlot*)
      - HUD System (Route_Map, Route_Pause)
      - Dialogue System (via Interact routing)
      - Investigation System (via Interact routing)
    adr: docs/architecture/adr-0003-enhanced-input-architecture.md
    referenced_by:
      - docs/architecture/adr-0003-enhanced-input-architecture.md
    added: "2026-05-19"
    revised: ""

  - contract: save_provider_registration
    status: active
    pattern: uinterface
    description: "Subsystems that contribute save data implement IHostileSaveProvider (PopulateSaveData / LoadFromSaveData) and call USaveLoadSubsystem::RegisterProvider(this) in their Initialize() after Collection.InitializeDependency<USaveLoadSubsystem>()."
    producer: USaveLoadSubsystem (calls all registered providers on save/load)
    consumers:
      - UTutorialSubsystem (FTutorialSaveData)
      - UQuestSubsystem (FQuestSaveData)
      - UFactionSubsystem (FFactionSaveData)
      - UInventorySubsystem (FInventorySaveData)
      - UInfectionSubsystem (FInfectionSaveData)
    adr: docs/architecture/adr-0006-save-load-serialization.md
    referenced_by:
      - docs/architecture/adr-0006-save-load-serialization.md
    added: "2026-05-20"
    revised: ""

  - contract: checkpoint_save_trigger
    status: active
    pattern: gameplay_message_router
    description: "ACheckpointActor broadcasts FCheckpointReachedMessage on TAG_Event_Checkpoint_Reached. USaveLoadSubsystem listens and calls TriggerAutosave(). No direct coupling between checkpoint actors and the save subsystem."
    producer: ACheckpointActor
    consumers:
      - USaveLoadSubsystem
    adr: docs/architecture/adr-0006-save-load-serialization.md
    referenced_by:
      - docs/architecture/adr-0006-save-load-serialization.md
    added: "2026-05-20"
    revised: ""

  - contract: physics_landed_event
    status: active
    pattern: dynamic_multicast_delegate
