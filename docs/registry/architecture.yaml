# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets:
  - system: alien_ai
    status: active
    budget_ms_per_alien: 0.5
    budget_ms_total: 4.0
    alien_count: 8
    target_fps: 60
    platform: PC
    breakdown: "BT tick <0.15ms; AI Perception <0.05ms; EQS query (when active) <0.10ms; Navigation <0.10ms; other <0.10ms"
    adr: docs/architecture/adr-0012-alien-ai-system.md
    referenced_by:
      - docs/architecture/adr-0012-alien-ai-system.md
    added: "2026-05-20"
    revised: ""

