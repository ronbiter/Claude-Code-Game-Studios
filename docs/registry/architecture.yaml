# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: inter_system_communication_owner_subscriber
    status: active
    api: DECLARE_DYNAMIC_MULTICAST_DELEGATE + AddDynamic/RemoveDynamic
    not: "Direct function calls, raw function pointers, Blueprint Event Dispatchers (for C++ core systems)"
    adr: docs/architecture/adr-0001-cross-system-communication.md
    reason: "Type-safe, Blueprint-accessible, UE reflection-compatible. Established pattern for owner→subscriber events."
    referenced_by:
      - docs/architecture/adr-0001-cross-system-communication.md
    added: "2026-05-15"
    revised: ""

  - purpose: game_state_machine_ownership
    status: active
    api: "UGameInstanceSubsystem (UHostileWorldGSM) + FTickableGameObject"
    not: "AGameMode-owned component, UWorldSubsystem, static singleton pointer"
    adr: docs/architecture/adr-0002-game-state-machine-implementation.md
    reason: "Survives level transitions (Loading state spans them). AGameMode is destroyed between loads. UGameInstanceSubsystem lives for the full game session."
    referenced_by:
      - docs/architecture/adr-0002-game-state-machine-implementation.md
    added: "2026-05-15"
    revised: ""

  - purpose: global_broadcast_communication
    status: active
    api: UGameplayMessageSubsystem (GameplayMessageRuntime module)
    not: "Custom event bus singleton, stringly-typed message maps"
    adr: docs/architecture/adr-0001-cross-system-communication.md
    reason: "Engine-provided, tag-based, type-safe broadcast system. Use instead of custom infrastructure."
    referenced_by:
      - docs/architecture/adr-0001-cross-system-communication.md
    added: "2026-05-15"
    revised: ""

  - purpose: input_action_binding_location
    status: active
    api: "APlayerController::SetupInputComponent() — all 22 IA_* BindAction calls here"
    not: "APawn/ACharacter::SetupPlayerInputComponent() for core gameplay actions; split binding across PC and Character"
    adr: docs/architecture/adr-0003-enhanced-input-architecture.md
    reason: "PC is the thin router. SetupInputComponent fires once and survives pawn swaps. All routing stays in one class."
    referenced_by:
      - docs/architecture/adr-0003-enhanced-input-architecture.md
    added: "2026-05-19"
    revised: ""

  - purpose: runtime_input_rebinding
    status: active
    api: "UEnhancedInputUserSettings::MapPlayerKey() + SaveSettings() / LoadSettings()"
    not: "AddPlayerMappedKey() / PlayerMappableInputConfig (pre-5.3 legacy path)"
    adr: docs/architecture/adr-0003-enhanced-input-architecture.md
    reason: "UEnhancedInputUserSettings is the UE 5.3+ production API with built-in persistence. Legacy path is superseded."
    referenced_by:
      - docs/architecture/adr-0003-enhanced-input-architecture.md
    added: "2026-05-19"
    revised: ""

  - purpose: subsystem_session_tier
    status: active
    api: "UGameInstanceSubsystem — UQuestSubsystem, UFactionSubsystem, USaveLoadSubsystem, UInventorySubsystem, UHostileWorldGSM"
    not: "UWorldSubsystem or ULocalPlayerSubsystem for state that must survive level transitions"
    adr: docs/architecture/adr-0004-subsystem-module-architecture.md
    reason: "Session-tier systems carry state across level transitions. UGameInstanceSubsystem lives for the full play session. NOTE: UInfectionSpreadSubsystem was incorrectly listed here — corrected to UWorldSubsystem by ADR-0013."
    referenced_by:
      - docs/architecture/adr-0004-subsystem-module-architecture.md
      - docs/architecture/adr-0013-infection-spread-architecture.md
    added: "2026-05-19"
    revised: "2026-05-20"

  - purpose: subsystem_world_tier
    status: active
    api: "UWorldSubsystem — UInfectionSpreadSubsystem, UAlienSquadSubsystem, UInvestigationSubsystem, UDialogueSubsystem"
    not: "UGameInstanceSubsystem for state that must reset on level transition"
    adr: docs/architecture/adr-0004-subsystem-module-architecture.md
    reason: "World-tier systems hold per-level state. UWorldSubsystem is auto-destroyed on level transition; Deinitialize() fires before world teardown. UInfectionSpreadSubsystem added by ADR-0013 (correcting ADR-0004 registry error)."
    referenced_by:
      - docs/architecture/adr-0004-subsystem-module-architecture.md
      - docs/architecture/adr-0013-infection-spread-architecture.md
    added: "2026-05-19"
    revised: "2026-05-20"

  - purpose: subsystem_player_tier
    status: active
    api: "ULocalPlayerSubsystem — UHUDSubsystem"
    not: "UGameInstanceSubsystem for viewport-bound UI state"
    adr: docs/architecture/adr-0004-subsystem-module-architecture.md
    reason: "Player-tier systems are viewport-bound. Access from AHUD requires GetOwningPlayerController()->GetLocalPlayer()->GetSubsystem<T>()."
    referenced_by:
      - docs/architecture/adr-0004-subsystem-module-architecture.md
    added: "2026-05-19"
    revised: ""

  - purpose: per_actor_state
    status: active
    api: "UActorComponent — UHealthComponent, UStealthComponent, UMovementComponent (custom), UCombatComponent"
    not: "UGameInstanceSubsystem or UWorldSubsystem for per-actor state"
    adr: docs/architecture/adr-0004-subsystem-module-architecture.md
    reason: "Per-actor behaviour lives and dies with the owning AActor. Subsystems are for shared/coordination state, not per-instance behaviour."
    referenced_by:
      - docs/architecture/adr-0004-subsystem-module-architecture.md
    added: "2026-05-19"
    revised: ""

  - purpose: primary_game_module
    status: active
    api: "HostileWorld — single primary module; all subsystems and gameplay classes in Source/HostileWorld/"
    not: "Feature sub-modules per system (HostileWorldGSM, HostileWorldAI, etc.)"
    adr: docs/architecture/adr-0004-subsystem-module-architecture.md
    reason: "Single module keeps Build.cs simple and cross-system headers accessible. Extract only when a system has 20+ files and a stable reuse boundary."
    referenced_by:
      - docs/architecture/adr-0004-subsystem-module-architecture.md
    added: "2026-05-19"
    revised: ""

  - purpose: game_data_bulk_tabular
    status: active
    api: "UDataTable + FTableRowBase — all bulk tabular game data (items, quests, clues, dialogue nodes, recipes, AI tuning)"
    not: "UPrimaryDataAsset for fixed-schema row data; inline TArray<USTRUCT> hardcoded in source"
    adr: docs/architecture/adr-0005-game-data-strategy.md
    reason: "DataTable provides CSV/JSON import workflow for designers and O(log n) row lookup. Consistent format across all bulk data systems."
    referenced_by:
      - docs/architecture/adr-0005-game-data-strategy.md
    added: "2026-05-19"
    revised: ""

  - purpose: game_data_complex_entity
    status: active
    api: "UPrimaryDataAsset subclass — entities requiring Blueprint subclassing or per-instance BP logic"
    not: "UDataTable for entities with custom Blueprint behaviour per variant"
    adr: docs/architecture/adr-0005-game-data-strategy.md
    reason: "UPrimaryDataAsset supports inheritance and Blueprint override. Reserved for complex entities not expressible as flat rows."
    referenced_by:
      - docs/architecture/adr-0005-game-data-strategy.md
    added: "2026-05-19"
    revised: ""

  - purpose: game_data_load_strategy
    status: active
    api: "TObjectPtr<UDataTable> UPROPERTY(EditDefaultsOnly) hard reference — all DataTable references on subsystems"
    not: "TSoftObjectPtr<UDataTable> async streaming; StaticLoadObject/LoadObject at gameplay call sites"
    adr: docs/architecture/adr-0005-game-data-strategy.md
    reason: "Hard references guarantee tables are available from GameInstance::Init() at indie PC scale. Async complexity not justified until profiling shows need."
    referenced_by:
      - docs/architecture/adr-0005-game-data-strategy.md
    added: "2026-05-19"
    revised: ""

  - purpose: save_serialization_format
    status: active
    api: "USaveGame subclass (UHostileWorldSaveGame) + UGameplayStatics::AsyncSaveGameToSlot / AsyncLoadGameFromSlot"
    not: "FArchive custom binary; JSON file; blocking SaveGameToSlot on game thread"
    adr: docs/architecture/adr-0006-save-load-serialization.md
    reason: "USaveGame + UPROPERTY reflection handles versioning, Blueprint access, and schema evolution automatically. Async I/O prevents game-thread hitch at checkpoint. Single slot eliminates slot-management UI."
    referenced_by:
      - docs/architecture/adr-0006-save-load-serialization.md
    added: "2026-05-20"
    revised: ""

  - purpose: save_async_delegate_binding
    status: active
    api: "FAsyncSaveGameToSlotDelegate::CreateUObject(this, &UClass::UFunctionMember)"
    not: "CreateLambda or raw function pointer for async save/load callbacks"
    adr: docs/architecture/adr-0006-save-load-serialization.md
    reason: "Lambda captures are not GC-safe with async delegates. UFUNCTION member binding is the only safe pattern for USaveGame callbacks."
    referenced_by:
      - docs/architecture/adr-0006-save-load-serialization.md
    added: "2026-05-20"
    revised: ""

  - purpose: physics_runtime
    status: active
    api: "Chaos Physics (UE 5.7 built-in) — UGeometryCollectionComponent for destruction, UPhysicalMaterial for surface materials"
    not: "Legacy PhysX APIs; any pre-UE5 physics primitive types"
    adr: docs/architecture/adr-0007-physics-collision-architecture.md
    reason: "PhysX was removed in UE5. Chaos is the only available runtime. Geometry Collection is the Chaos-native destructible pipeline."
    referenced_by:
      - docs/architecture/adr-0007-physics-collision-architecture.md
    added: "2026-05-20"
    revised: ""

  - purpose: custom_collision_channels
    status: active
    api: "EHostileCollision namespace aliases (HostileCollisionChannels.h) — ECC_GameTraceChannel1..8 mapped to Player/Alien/Infection/WorldObject/Vehicle/Projectile/Interactable/AIPerception"
    not: "Raw ECC_GameTraceChannelN magic numbers in code; ECC_Visibility for gameplay-specific traces"
    adr: docs/architecture/adr-0007-physics-collision-architecture.md
    reason: "Named aliases prevent channel number collisions, make collision intent readable, and allow channel remapping via a single header change."
    referenced_by:
      - docs/architecture/adr-0007-physics-collision-architecture.md
    added: "2026-05-20"
    revised: ""

  - purpose: world_streaming_authority
    status: active
    api: "World Partition (automatic, distance-based) — sole streaming authority for open world; separate UWorld for Mountain Prison via OpenLevel()"
    not: "ALevelStreamingVolume or manual LevelStreaming actors in the open world; mixing LevelStreaming and World Partition in the same world"
    adr: docs/architecture/adr-0008-scene-streaming-architecture.md
    reason: "World Partition is UE5's production streaming system. Mixing LevelStreaming and World Partition in the same world produces undefined streaming behavior per Epic documentation."
    referenced_by:
      - docs/architecture/adr-0008-scene-streaming-architecture.md
    added: "2026-05-20"
    revised: ""

  - purpose: data_layer_activation
    status: active
    api: "USceneManagementSubsystem::RequestDataLayerSwap(FName ZoneId, FName TargetLayer) — the only valid path for Data Layer activation/deactivation at runtime"
    not: "Direct UDataLayerSubsystem::SetDataLayerInstanceRuntimeState() calls from any system other than USceneManagementSubsystem"
    adr: docs/architecture/adr-0008-scene-streaming-architecture.md
    reason: "Centralizing Data Layer writes enforces the DL swap state machine (rollback, queue, 3s debounce). Direct calls bypass rollback and produce inconsistent world state."
    referenced_by:
      - docs/architecture/adr-0008-scene-streaming-architecture.md
    added: "2026-05-20"
    revised: ""

  - purpose: camera_mode_owner
    status: active
    api: "AHostileWorldPlayerCameraManager (APlayerCameraManager subclass) — owns all camera mode state, shake dispatch, recoil, and Cinematic delegation"
    not: "ULocalPlayerSubsystem for camera mode state; UActorComponent on PlayerController for camera logic; UCameraMode stack (Lyra pattern — not a built-in engine API)"
    adr: docs/architecture/adr-0009-camera-architecture.md
    reason: "APlayerCameraManager is the engine's designated camera owner. UpdateViewTarget() runs in the camera manager; all engine shake and FOV APIs live on it. Any other owner requires polling the camera manager — forbidden pattern (ADR-0001)."
    referenced_by:
      - docs/architecture/adr-0009-camera-architecture.md
    added: "2026-05-20"
    revised: ""

  - purpose: movement_component_pattern
    status: active
    api: "UHostileMovementComponent : UCharacterMovementComponent — CMC subclass with PhysCustom(0)=Dodge, PhysCustom(1)=Cover; UCoverComponent : UActorComponent for cover proximity"
    not: "UGameplayAbility (GAS) for sprint/dodge/cover; full custom physics bypassing CMC; separate UMovementStateMachineComponent alongside CMC"
    adr: docs/architecture/adr-0010-movement-architecture.md
    reason: "CMC subclassing is canonical UE5 pattern — preserves NavMesh agent integration, foot IK floor data, ramp/step handling, and replication base. GAS adds unjustified module overhead for single-player. Separate state machine component creates CMC synchronisation hazards."
    referenced_by:
      - docs/architecture/adr-0010-movement-architecture.md
    added: "2026-05-20"
    revised: ""

  - purpose: cover_detection_pattern
    status: active
    api: "UCoverComponent FTimerHandle at 4Hz + event triggers on IA_Crouch input and direction change — never per-frame SphereOverlap"
    not: "Per-frame SphereOverlapActors in Tick(); CMC-internal cover detection"
    adr: docs/architecture/adr-0010-movement-architecture.md
    reason: "Per-frame overlap queries for cover detection violate polling_state_in_tick forbidden pattern. 4Hz poll + event triggers provide sufficient responsiveness (≤250ms latency) at ~0.1ms amortised cost."
    referenced_by:
      - docs/architecture/adr-0010-movement-architecture.md
    added: "2026-05-20"
    revised: ""

  - purpose: noise_emission_api
    status: active
    api: "UAIPerceptionSystem::MakeNoise(Instigator, Loudness, NoiseInstigator, Location) OR FAINoiseEvent + UAIPerceptionSystem::ReportEvent()"
    not: "UAIPerceptionSystem::ReportNoise() (does not exist); UAIPerceptionComponent::ReportNoise() (does not exist); manual per-alien noise delivery"
    adr: docs/architecture/adr-0010-movement-architecture.md
    reason: "MakeNoise() is the stable static helper (UE4+) that internally constructs FAINoiseEvent and dispatches to all registered UAISenseConfig_Hearing listeners. ReportNoise() does not exist on either class — confirmed by engine specialist review."
    referenced_by:
      - docs/architecture/adr-0010-movement-architecture.md
    added: "2026-05-20"
    revised: ""

  - purpose: animation_blueprint_pattern
    status: active
    api: "UHostileWorldAnimInstance : UAnimInstance + Linked Anim Layers (UHostileCombatLayer, UHostileCoverLayer, UHostileLocomotionLayer) switched via LinkAnimClassLayers()/UnlinkAnimClassLayers()"
    not: "Single monolithic ABP state machine with all body regions inline; dual USkeletalMeshComponent (master-pose) for body splits; Control Rig VM for full-body procedural animation"
    adr: docs/architecture/adr-0011-animation-architecture.md
    reason: "Linked Anim Layers eliminate combinatorial state explosion (8 movement states × 4 weapon types × cover on/off). They are the UE5-native split-body solution within a single skeletal mesh component."
    referenced_by:
      - docs/architecture/adr-0011-animation-architecture.md
    added: "2026-05-20"
    revised: ""

  - purpose: foot_ik_implementation
    status: active
    api: "IK Rig runtime node in ABP post-process graph (IKRig_HostileCharacter) — two foot goals (IK_Foot_L, IK_Foot_R) with alpha-based enable/disable"
    not: "Control Rig VM node for foot IK (heavier than IK Rig; unjustified overhead for two-bone foot IK); legacy Two Bone IK node without pelvis correction; foot IK disabled entirely"
    adr: docs/architecture/adr-0011-animation-architecture.md
    reason: "IK Rig runtime node is purpose-built for limb IK and lighter than Control Rig VM. movement-system.md mandates foot IK on all locomotion surfaces. Alpha-based blending on the IK node disables cleanly during Dodge/Jump/Fall without graph branching."
    referenced_by:
      - docs/architecture/adr-0011-animation-architecture.md
    added: "2026-05-20"
    revised: ""

  - purpose: ai_framework
    status: active
    api: "Behavior Trees (UBehaviorTreeComponent) + UAIPerceptionComponent + Environment Query System (UEnvQueryManager) — UE5 native AI stack"
    not: "Custom FSM UActorComponent for alien decision-making; GAS (Gameplay Ability System) for attack execution"
    adr: docs/architecture/adr-0012-alien-ai-system.md
    reason: "BT provides visual editor, abort logic, and service scheduling purpose-built for this use case. EQS abstracts spatial queries. Custom FSM reinvents the stack; GAS adds unjustified module overhead for single-player (same rejection as ADR-0004 for movement)."
    referenced_by:
      - docs/architecture/adr-0012-alien-ai-system.md
    added: "2026-05-20"
    revised: ""

  - purpose: navmesh_runtime_area_painting
    status: active
    api: "UNavModifierComponent on pooled actors spawned by UInfectionSpreadSubsystem — painted automatically when Runtime Generation = Dynamic"
    not: "UNavSystem::ApplyRadiusModifier (class does not exist in UE5); UNavigationSystemV1 method call for area painting; direct NavMesh tile mutation"
    adr: docs/architecture/adr-0012-alien-ai-system.md
    reason: "UNavModifierComponent is the UE5-native pattern for runtime NavArea painting. It registers with the navigation octree automatically and handles World Partition dynamic cell loading. UNavSystem does not exist — the correct runtime access class is UNavigationSystemV1, used for path queries only."
    referenced_by:
      - docs/architecture/adr-0012-alien-ai-system.md
      - docs/architecture/adr-0013-infection-spread-architecture.md
    added: "2026-05-20"
    revised: ""

  - purpose: infection_source_damage_api
    status: active
    api: "IInfectionSpreadInterface::DamageInfectionSource(FGuid SourceId, float Amount) → bool — the only valid path for reducing infection source HP"
    not: "Direct HP field mutation on FInfectionSourceData; calling TakeDamage on the source actor; Combat System managing source HP internally"
    adr: docs/architecture/adr-0013-infection-spread-architecture.md
    reason: "Infection sources are not standard health actors — they have no UHealthComponent. UInfectionSpreadSubsystem manages source HP internally and decides when to set bDestroyed. All damage must go through DamageInfectionSource() to ensure consistent source lifecycle management."
    referenced_by:
      - docs/architecture/adr-0013-infection-spread-architecture.md
    added: "2026-05-20"
    revised: ""

