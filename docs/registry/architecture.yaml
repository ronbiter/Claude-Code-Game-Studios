# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER systems must be built.
#     An internal implementation detail that affects only one ADR does not need
#     to be registered.
#   - Never delete entries — set status: superseded_by: ADR-NNNN instead.
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Phase 5 — after ADR is approved)
# READ BY:    /architecture-decision (Step 2 — before authoring begins)
#             /architecture-review (Phase 4 — cross-ADR conflict baseline)
#             /create-stories (to embed architectural constraints in stories)
#             /dev-story (to check implementation against accepted stances)
#
# SEARCH PATTERNS (for skills using Grep):
#   All state owners:       Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   Who owns player_health: Grep pattern="state: player_health"
#   All signal contracts:   Grep pattern="pattern: signal"
#   Budget for combat:      Grep pattern="system: combat"
#   All forbidden patterns: Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:     Grep pattern="status: superseded"

version: 1
last_updated: "2026-05-20"

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: game_state_machine_stack
    status: active
    owner_system: UHostileWorldGSM
    adr: docs/architecture/adr-0002-game-state-machine-implementation.md
    interface: "GetCurrentState() → FGameplayTag (read-only); IsStateActive(FGameplayTag) → bool; RequestStateTransition(FFSMEvent) — only valid write path"
    write_access: UHostileWorldGSM-only
    referenced_by:
      - docs/architecture/adr-0002-game-state-machine-implementation.md
    added: "2026-05-15"
    revised: ""

  - state: active_input_mapping_contexts
    status: active
    owner_system: AHostileWorldPlayerController
    adr: docs/architecture/adr-0003-enhanced-input-architecture.md
    interface: "PushIMC(UInputMappingContext*, int32 Priority); PopIMC(UInputMappingContext*) — all callers must go through PC"
    write_access: AHostileWorldPlayerController-only (Movement/Combat call PushIMC/PopIMC via PC public interface)
    referenced_by:
      - docs/architecture/adr-0003-enhanced-input-architecture.md
    added: "2026-05-19"
    revised: ""

  - state: save_data
    status: active
    owner_system: USaveLoadSubsystem
    adr: docs/architecture/adr-0006-save-load-serialization.md
    interface: "TriggerAutosave() — only valid save path; LoadSaveOnStartup() called from UGameInstance::OnStart(); RegisterProvider(IHostileSaveProvider*) for subsystem opt-in"
    write_access: USaveLoadSubsystem-only (no subsystem may call AsyncSaveGameToSlot directly)
    referenced_by:
      - docs/architecture/adr-0006-save-load-serialization.md
    added: "2026-05-20"
    revised: ""

  - state: physics_surface_state
    status: active
    owner_system: UPhysicsHelperSubsystem
    adr: docs/architecture/adr-0007-physics-collision-architecture.md
    interface: "GetSurfaceType(FVector Location) → EHostileSurfaceType (read-only query); CalculateFallDamage(float) → float (pure formula); OnPlayerLanded / OnImpact delegates (subscribe via AddDynamic in BeginPlay)"
    write_access: UPhysicsHelperSubsystem-only (AHostileCharacter calls NotifyPlayerLanded/NotifyImpact; no other actor may fire these delegates)
    referenced_by:
      - docs/architecture/adr-0007-physics-collision-architecture.md
    added: "2026-05-20"
    revised: ""

  - state: scene_streaming_state
    status: active
    owner_system: USceneManagementSubsystem
    adr: docs/architecture/adr-0008-scene-streaming-architecture.md
    interface: "GetCurrentZone() → FName (read-only); GetZoneState(FName) → FZoneState (read-only); RequestDataLayerSwap(FName ZoneId, FName TargetLayer) — only valid Data Layer write path; GetStreamingState() → FStreamingState (read-only)"
    write_access: USceneManagementSubsystem-only (UInfectionSpreadSubsystem and others call RequestDataLayerSwap via ISceneManagementSubsystem interface; no system may call UDataLayerSubsystem directly)
    referenced_by:
      - docs/architecture/adr-0008-scene-streaming-architecture.md
    added: "2026-05-20"
    revised: ""

  - state: camera_mode_state
    status: active
    owner_system: AHostileWorldPlayerCameraManager
    adr: docs/architecture/adr-0009-camera-architecture.md
    interface: "GetCameraMode() → EHostileCameraMode (read-only); SetCameraMode(Mode, BlendTime) — only valid mode-write path (called by AHostileWorldPlayerController only); AddShake(Class, Scale); AddRecoil(Pitch, Yaw)"
    write_access: AHostileWorldPlayerController-only (calls SetCameraMode via ICameraSystem interface; no other actor may set camera mode directly)
    referenced_by:
      - docs/architecture/adr-0009-camera-architecture.md
    added: "2026-05-20"
    revised: ""

  - state: movement_state
    status: active
    owner_system: UHostileMovementComponent
    adr: docs/architecture/adr-0010-movement-architecture.md
    interface: "GetCurrentMovementState() → EHostileMovementState (read-only); OnMovementStateChanged delegate (subscribe via AddDynamic in BeginPlay)"
    write_access: UHostileMovementComponent-only (state resolved internally from CMC physics mode and input events; no external system may set movement state directly)
    referenced_by:
      - docs/architecture/adr-0010-movement-architecture.md
    added: "2026-05-20"
    revised: ""

  - state: character_stamina
    status: active
    owner_system: AHostileCharacter
    adr: docs/architecture/adr-0010-movement-architecture.md
    interface: "CanSprint() → bool; CanDodge(float Cost) → bool; CanJump() → bool (read-only queries for CMC); ConsumeStamina(float) and RegenStamina(float DeltaTime) — only valid write paths, called by CMC"
    write_access: AHostileCharacter-only via ConsumeStamina/RegenStamina (CMC calls these methods; no other system may write stamina directly)
    referenced_by:
      - docs/architecture/adr-0010-movement-architecture.md
    added: "2026-05-20"
    revised: ""

  - state: alien_squad_state
    status: active
    owner_system: UAlienSquadSubsystem
    adr: docs/architecture/adr-0012-alien-ai-system.md
    interface: "RegisterAlien(AAlienAIController*); UnregisterAlien(AAlienAIController*); GetSquadById(int32) → TArray<TWeakObjectPtr<AAlienAIController>>; GetAllActiveAliens() → TArray<TWeakObjectPtr<AAlienAIController>>; NotifyPlayerPosition(FVector); BroadcastSquadAlert(Source, Location, Score)"
    write_access: UAlienSquadSubsystem-only (AAlienAIController calls RegisterAlien/UnregisterAlien and BroadcastSquadAlert via subsystem; no direct TArray mutation from outside)
    referenced_by:
      - docs/architecture/adr-0012-alien-ai-system.md
    added: "2026-05-20"
    revised: ""

  - state: infection_spread_state
    status: active
    owner_system: UInfectionSpreadSubsystem
    adr: docs/architecture/adr-0013-infection-spread-architecture.md
    interface: "IInfectionSpreadInterface — GetCellInfectionLevel(FIntPoint) → float; GetCellState(FIntPoint) → ECellInfectionState; GetNearbyCellInfectionLevels(FVector, float) → TArray; GetZoneInfectionLevel(FName) → float; GetActiveSourceCount(FName) → int32; GetSourcesInRadius(FVector, float) → TArray; DamageInfectionSource(FGuid, float) → bool; DeployCure(FVector) → bool. All callers use IInfectionSpreadInterface — no direct cast to UInfectionSpreadSubsystem."
    write_access: UInfectionSpreadSubsystem-only (FTimerHandle-driven ticks update CellData; DamageInfectionSource() and DeployCure() are the only external write paths)
    referenced_by:
      - docs/architecture/adr-0013-infection-spread-architecture.md
    added: "2026-05-20"
    revised: ""

