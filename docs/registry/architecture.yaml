# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: polling_state_in_tick
    status: active
    description: "A Tick() function must not read another system's state to detect changes. Subscribe to the state change event instead."
    why: "Polling creates hidden per-frame CPU overhead and breaks the event-driven architecture. Every system polling every other system at 60fps is unmaintainable."
    adr: docs/architecture/adr-0001-cross-system-communication.md
    added: "2026-05-15"

  - pattern: direct_cross_system_state_write
    status: active
    description: "A system must never write to state owned by another system. Use method calls on the owning system instead."
    why: "Direct state writes create race conditions, break state ownership, and make systems untestable in isolation."
    adr: docs/architecture/adr-0001-cross-system-communication.md
    added: "2026-05-15"

  - pattern: autoload_singleton_gsm
    status: active
    description: "UHostileWorldGSM must not be held as a static pointer. Access via GetGameInstance()->GetSubsystem<UHostileWorldGSM>()."
    why: "Static pointers are not GC-safe, invisible to engine tooling, and break in PIE with multiple worlds."
    adr: docs/architecture/adr-0002-game-state-machine-implementation.md
    added: "2026-05-15"

  - pattern: legacy_input_system
    status: active
    description: "BindAction/BindAxis on raw UInputComponent must not be used. All input bindings use UEnhancedInputComponent::BindAction() on TObjectPtr<UInputAction> assets."
    why: "Legacy input is deprecated in UE5, has no context switching, no runtime rebinding, and will be removed in future versions."
    adr: docs/architecture/adr-0003-enhanced-input-architecture.md
    added: "2026-05-19"

  - pattern: blueprint_event_dispatchers_for_cpp_core

  - pattern: blueprint_event_dispatchers_for_cpp_core
    status: active
    description: "Blueprint Event Dispatchers must not be used for C++ core system communication. Use DECLARE_DYNAMIC_MULTICAST_DELEGATE instead."
    why: "BP dispatchers are not type-safe at the C++ boundary and create hidden coupling between C++ and Blueprint layers. Core system contracts must be defined in C++."
    adr: docs/architecture/adr-0001-cross-system-communication.md
    added: "2026-05-15"

  - pattern: static_subsystem_pointer
    status: active
    description: "Subsystem instances must never be cached in a static pointer or member variable. Always call GetSubsystem<T>() at the call site."
    why: "Static pointers are not GC-safe, invisible to engine tooling, and break in PIE multi-world where multiple subsystem instances exist."
    adr: docs/architecture/adr-0004-subsystem-module-architecture.md
    added: "2026-05-19"

  - pattern: initialize_peer_caching
    status: active
    description: "UGameInstanceSubsystem::Initialize() must not call GetSubsystem<T>() on a peer unless preceded by Collection.InitializeDependency<T>(). Peer initialization order is not guaranteed."
    why: "Peer Initialize() ordering within a tier is undefined. Caching a peer in Initialize() returns a valid pointer to an uninitialized subsystem, producing silent undefined behaviour."
    adr: docs/architecture/adr-0004-subsystem-module-architecture.md
    added: "2026-05-19"

  - pattern: hud_direct_get_local_player
    status: active
    description: "AHUD must not call GetLocalPlayer() directly — that method does not exist on AHUD. Use GetOwningPlayerController()->GetLocalPlayer()->GetSubsystem<T>()."
    why: "AHUD exposes GetOwningPlayerController(), not GetLocalPlayer(). Calling a nonexistent method fails to compile and indicates a misunderstanding of the UMG/HUD object hierarchy."
    adr: docs/architecture/adr-0004-subsystem-module-architecture.md
    added: "2026-05-19"

  - pattern: cross_subsystem_datatable_access
    status: active
    description: "A subsystem must not hold a TObjectPtr<UDataTable> to a table it does not own, nor call FindRow on another subsystem's table. Request data via a method call on the owning subsystem instead."
    why: "Cross-subsystem table access breaks state ownership (ADR-0001), creates hidden coupling, and makes subsystems untestable in isolation."
    adr: docs/architecture/adr-0005-game-data-strategy.md
    added: "2026-05-19"

  - pattern: findrow_unchecked_result
    status: active
    description: "FindRow<T>() return value must be null-checked before dereferencing. Never assume a row exists."
    why: "FindRow returns nullptr on any miss (wrong RowName, wrong struct type, empty table). An unchecked dereference crashes at runtime with no error context."
    adr: docs/architecture/adr-0005-game-data-strategy.md
    added: "2026-05-19"

  - pattern: findrow_empty_context_string
    status: active
    description: "FindRow<T>(RowName, ContextString) must be called with a non-empty ContextString identifying the call site (e.g. TEXT(\"UInventorySubsystem::GetItemDefinition\"))."
    why: "An empty ContextString makes lookup failures silent in the output log, turning data authoring errors into invisible runtime bugs."
    adr: docs/architecture/adr-0005-game-data-strategy.md
    added: "2026-05-19"

  - pattern: direct_async_save_call
    status: active
    description: "No subsystem may call UGameplayStatics::AsyncSaveGameToSlot or AsyncLoadGameFromSlot directly. All save/load I/O must go through USaveLoadSubsystem::TriggerAutosave() and LoadSaveOnStartup()."
    why: "Direct save calls from multiple subsystems produce race conditions, duplicate writes, and bypass the IHostileSaveProvider aggregation contract. USaveLoadSubsystem is the sole save authority."
    adr: docs/architecture/adr-0006-save-load-serialization.md
    added: "2026-05-20"

  - pattern: uobject_in_save_struct
    status: active
    description: "No save USTRUCT (FTutorialSaveData, FQuestSaveData, FFactionSaveData, FInventorySaveData, FInfectionSaveData, or any future save sub-struct) may contain UObject*, TObjectPtr<>, or TWeakObjectPtr<> fields."
    why: "USaveGame serialization silently drops UObject* fields — object references do not survive save/load. Only primitive types, FString, FName, TArray/TMap/TSet of primitives are safe."
    adr: docs/architecture/adr-0006-save-load-serialization.md
    added: "2026-05-20"

  - pattern: save_lambda_delegate
    status: active
    description: "FAsyncSaveGameToSlotDelegate and FAsyncLoadGameFromSlotDelegate must not be bound via CreateLambda. Use CreateUObject(this, &UClass::UFunctionMember) with a UFUNCTION-marked member."
    why: "Lambda captures are not GC-safe with async delegates. If the lambda captures a UObject* that is garbage-collected between the save call and the callback, the callback dereferences a dangling pointer — silent crash."
    adr: docs/architecture/adr-0006-save-load-serialization.md
    added: "2026-05-20"

  - pattern: legacy_physx_apis
    status: active
    description: "No legacy PhysX primitive types, NxActor, or pre-UE5 physics APIs may be used. All physics is Chaos-native."
    why: "PhysX was removed in UE5. Any legacy physics API will fail to compile in UE 5.7."
    adr: docs/architecture/adr-0007-physics-collision-architecture.md
    added: "2026-05-20"

  - pattern: async_physics_with_sync_queries
    status: active
    description: "bTickPhysicsAsync must remain disabled (default). Do not enable async physics without revising ADR-0007."
    why: "Enabling async physics decouples physics state from the game thread. UPhysicsHelperSubsystem::GetSurfaceType() would read stale frame-N-1 data, producing incorrect surface classification and fall damage calculation."
    adr: docs/architecture/adr-0007-physics-collision-architecture.md
    added: "2026-05-20"

  - pattern: raw_collision_channel_numbers
    status: active
    description: "Raw ECC_GameTraceChannelN enum values must not be used in gameplay code. Use EHostileCollision:: namespace aliases from HostileCollisionChannels.h."
    why: "Magic channel numbers are unreadable and break silently if DefaultEngine.ini channel order changes. Named aliases make intent explicit and centralise remapping."
    adr: docs/architecture/adr-0007-physics-collision-architecture.md
    added: "2026-05-20"

  - pattern: manual_level_streaming_in_open_world
    status: active
    description: "No ALevelStreamingVolume, manual LevelStreaming actor, or ULevelStreamingDynamic calls may exist in the open world map. World Partition is the sole streaming authority."
    why: "World Partition and manual LevelStreaming are competing authorities. Mixing them in the same world produces undefined streaming behavior: double-streaming, incorrect cell unloads, missing collision."
    adr: docs/architecture/adr-0008-scene-streaming-architecture.md
    added: "2026-05-20"

  - pattern: direct_data_layer_write
    status: active
    description: "No subsystem may call UDataLayerSubsystem::SetDataLayerInstanceRuntimeState() directly. All Data Layer activation must go through USceneManagementSubsystem::RequestDataLayerSwap()."
    why: "Direct Data Layer writes bypass the DL_Idle→Active state machine, skip rollback logic, ignore the swap queue, and bypass the 3.0s debounce. This leaves the world in an inconsistent partial state."
    adr: docs/architecture/adr-0008-scene-streaming-architecture.md
    added: "2026-05-20"

  - pattern: direct_stamina_write
    status: active
    description: "UHostileMovementComponent must never write AHostileCharacter's stamina float directly. All stamina writes go through AHostileCharacter::ConsumeStamina(float) and AHostileCharacter::RegenStamina(float DeltaTime). CMC queries via CanSprint/CanDodge/CanJump (read-only)."
    why: "Direct stamina writes from CMC couple the physics component to character state, break testability, and violate direct_cross_system_state_write (ADR-0001). Stamina authority belongs to AHostileCharacter."
    adr: docs/architecture/adr-0010-movement-architecture.md
    added: "2026-05-20"

  - pattern: mid_tick_cover_exit
    status: active
    description: "UCoverComponent must not call SetMovementMode() to exit cover mid-tick. Cover exit must be deferred to UpdateCharacterStateAfterMovement() to prevent one-frame state flicker."
    why: "Calling SetMovementMode() during PhysCustom() execution changes the mode while CMC is still processing the current frame's physics. This produces a one-frame inconsistency between the movement state enum and the actual physics mode, causing visible character position jitter."
    adr: docs/architecture/adr-0010-movement-architecture.md
    added: "2026-05-20"

  - pattern: direct_ia_binding_in_movement
    status: active
    description: "UHostileMovementComponent and UCoverComponent must not call BindAction() on any UInputAction directly. Movement input is received exclusively via AHostileWorldPlayerController multicast delegates (OnMove, OnSprint, OnCrouch, OnJump, OnDodge, OnLean*)."
    why: "ADR-0003 establishes PC as the sole IA_* binding location. Direct CMC binding bypasses IMC context switching, breaks the thin-router pattern, and produces input that fires regardless of active mapping context."
    adr: docs/architecture/adr-0010-movement-architecture.md
    added: "2026-05-20"

  - pattern: anim_bp_movement_state_polling
    status: active
    description: "UHostileWorldAnimInstance::NativeUpdateAnimation() must not call UHostileMovementComponent::GetCurrentMovementState() to detect state transitions. CachedMovementState is updated exclusively by the OnMovementStateChanged delegate callback."
    why: "Calling GetCurrentMovementState() each tick to detect state changes violates polling_state_in_tick (ADR-0001). Montage triggers and layer switches are event-driven, not tick-polled. Reading velocity/speed/direction for blending is permitted — that is continuous interpolation, not change detection."
    adr: docs/architecture/adr-0011-animation-architecture.md
    added: "2026-05-20"

  - pattern: direct_montage_play
    status: active
    description: "External systems (Combat System, Movement System) must not call GetMesh()->GetAnimInstance()->Montage_Play() directly. All external montage requests must go through AHostileCharacter proxy methods: PlayFireMontage(), PlayReloadMontage(), PlayMeleeMontage(). Internal ABP callbacks (dodge, cover) call Montage_Play() inside UHostileWorldAnimInstance."
    why: "Direct Montage_Play() calls bypass the UHostileWorldAnimInstance abstraction, create direct coupling between callers and ABP internals, and prevent the animation system from managing slot priority, blend weight, and montage state coherently."
    adr: docs/architecture/adr-0011-animation-architecture.md
    added: "2026-05-20"

  - pattern: perception_without_setperception
    status: active
    description: "When UAIPerceptionComponent lives on AAlienCharacter (not on AAlienAIController), the controller MUST call SetPerceptionComponent(*PerceptionComp) in OnPossess(). Omitting this makes GetPerceptionComponent() on the controller return null."
    why: "The UE5 AI system uses the controller's perception component pointer for threat map bookkeeping and dominant-sense resolution. If the component is on the Character but not registered with the controller, any BT service or task that navigates through AAIController::GetPerceptionComponent() will dereference null and crash."
    adr: docs/architecture/adr-0012-alien-ai-system.md
    added: "2026-05-20"

  - pattern: damage_sense_implicit_fire
    status: active
    description: "UAISenseConfig_Damage does NOT fire automatically when ApplyDamage() is called on an alien. The combat damage pipeline MUST explicitly call UAIPerceptionSystem::ReportDamageEvent(World, DamagedActor, Instigator, Location, HitDirection, Amount) after each damage application."
    why: "UAISense_Damage is a passive listener — it only processes FAIDamageEvent structs delivered via ReportDamageEvent. There is no hook into the engine's TakeDamage pathway. Relying on implicit firing means the alien never perceives being shot."
    adr: docs/architecture/adr-0012-alien-ai-system.md
    added: "2026-05-20"

  - pattern: direct_infection_subsystem_cast
    status: active
    description: "No system may Cast<UInfectionSpreadSubsystem>(GetWorld()->GetSubsystem<UInfectionSpreadSubsystem>()) and call methods directly. All callers must use Cast<IInfectionSpreadInterface> on the subsystem pointer."
    why: "Direct type cast couples callers to the concrete implementation class, breaking testability and the interface contract established by ADR-0013. IInfectionSpreadInterface is the stable API surface — the concrete class is an implementation detail."
    adr: docs/architecture/adr-0013-infection-spread-architecture.md
    added: "2026-05-20"

